          type: string
          description: Plan period the goals are taken from
          example: "2026"
        goals:
          type: array
          description: Region's own overarching goals, verbatim and complete (empty for link-only)
          items:
            $ref: "#/components/schemas/RegionPlanGoal"

    RecentBetankande:
      type: object
      required: [title, organ, date, beteckning, decided, decisionDate, status, riksmote]
      properties:
        title:
          type: string
          example: "Betänkande om sjukvårdsreform"
        organ:
          type: string
          description: >-
            Committee abbreviation. No committee filter is applied, so any
            Riksdag committee can appear here — not only the handful named
            elsewhere in this spec (e.g. AU, FiU, JuU, KU, NU, SkU, SoU, TU,
            UbU, UU, CU, and others).
          example: "SoU"
        date:
          type: string
          description: >-
            Riksdagen's `datum` — when the document was published or last
            touched, never when the chamber decided. On every decided
            betänkande checked on 2026-08-14, `decisionDate` fell one to six
            days after this. Must not be rendered as a decision date.
          example: "2026-08-12"
        beteckning:
          type: string
          example: "SoU1"
        decided:
          type: boolean
          description: >-
            Whether the chamber has decided this betänkande. Riksdagen's
            `beslutad` flag when the payload has one (0 or 1; the JSON type
            varies). A non-empty `decisionDate` is not enough: on 2026-10-27
            rows with status "planerat" carried a December `decisionDate` and
            `beslutad` 0, and published reports the chamber has not voted on
            yet did the same. When the flag is absent, this is false for
            status "planerat" and for a `decisionDate` after today.
          example: true
        decisionDate:
          type: string
          description: >-
            Riksdagen's `beslutsdag`. Filled for planned items with the day
            the chamber is scheduled to vote, so it is not the signal for
            `decided`. Empty when Riksdagen has no date at all.
          example: "2026-08-13"
        status:
          type: string
          description: >-
            Riksdagen's own lifecycle word, passed through verbatim — e.g.
            "Webbpublicering" for a published decision, "planerat" for one
            scheduled but not yet written. Never translated into a claim of
            ours.
          example: "Webbpublicering"
        riksmote:
          type: string
          description: >-
            Riksdagen's `rm`, e.g. "2026/27". Beteckning numbering restarts
            each riksmöte, so a decision link has to carry this or `/beslut/SfU4`
            can open another year's betänkande. Empty when the upstream row
            omitted `rm`.
          example: "2026/27"

