        departmentCode: { type: string }
        party:          { type: string }
        politicianId:   { type: string, nullable: true }
        photoUrl:       { type: string, nullable: true }
        bio:            { type: string, nullable: true }
        active:         { type: boolean }
        createdAt:      { type: string, format: date-time }

