openapi: "3.1.0"
info:
  title: Riksdagskollen API
  description: Tracks Swedish politicians' stated promises and party goals against their actual voting records in Riksdagen.
  version: "1.0.0"
  contact:
    name: Riksdagskollen

servers:
  - url: /api
    description: API base path

tags:
  - name: health
    description: Health checks
  - name: parties
    description: Party goals and scorecards
  - name: politicians
    description: Individual politician profiles and voting records
  - name: motions
    description: Motions (motioner) with authors and yrkanden
  - name: votes
    description: Vote details with proposal origin context
  - name: aendringslogg
    description: The append-only change log (public read)
  - name: write
    description: Token-protected write API for the bot (ADR-003). Absent (404) when no token is configured.
  - name: budget
    description: National budget (statsbudgeten) tracking and comparison
  - name: context
    description: Topic-level budget context for voters
  - name: regions
    description: Swedish regional (läns) election results and governing coalitions
  - name: municipalities
    description: Swedish municipal (kommunal) election results and governing coalitions
  - name: riksdag
    description: National level — state agency expenditure data
  - name: ministers
    description: Cabinet ministers and their proposals
  - name: committees
    description: Riksdag committees (utskott) and the utgiftsområden they bereder
  - name: data
    description: The Data section — what each source holds and how much of it is loaded

paths:
  /riksdag/authorities:
    get:
      operationId: getRiksdagAuthorities
      tags: [riksdag]
      summary: State agencies with actual annual expenditure (driftkostnader)
      responses:
        "200":
          description: List of state agencies sorted by expenditure descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiksdagAuthority"
        "502":
          description: Upstream data source unavailable

  /riksdag/authorities/stats:
    get:
      operationId: getRiksdagAuthorityStats
      tags: [riksdag]
      summary: Aggregated coverage of the authorities register
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityStats"
        "500":
          description: Server error

  /riksdag/authorities/list:
    get:
      operationId: listRiksdagMyndigheter
      tags: [riksdag]
      summary: Searchable/filterable list of all state agencies (from authorities table)
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text name match (ILIKE)
        - name: underGovernment
          in: query
          schema: { type: string, enum: ["true", "false"] }
          description: Filter to agencies under the Government (true) or not (false)
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredAuthorityList"
        "500":
          description: Server error

  /riksdag/authorities/{slug}:
    get:
      operationId: getRiksdagAuthority
      tags: [riksdag]
      summary: Single state agency detail including regleringsbrev link
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: polismyndigheten
      responses:
        "200":
          description: Agency detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiksdagAuthorityDetail"
        "404":
          description: Agency not found
        "502":
          description: Upstream data source unavailable

  /party-meta:
    get:
      operationId: listPartyMeta
      summary: List all parties with metadata
      tags: [parties]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'

  /party-meta/{code}:
    get:
      operationId: getPartyMeta
      summary: Get party metadata by code
      tags: [parties]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '404':
          description: Party not found

  /ministers:
    get:
      operationId: listMinisters
      summary: List active ministers grouped by department
      tags: [ministers]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentGroup'

  /ministers/{id}:
    get:
      operationId: getMinister
      summary: Get minister detail with proposals
      tags: [ministers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinisterDetail'
        '404':
          description: Minister not found

  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness check
      description: >-
        Process is up. Does not touch the database. Served at the process
        root (`/healthz`), like the other health routes, and used as the
        Kubernetes liveness probe so a database blip does not restart the pod.
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: getReady
      tags: [health]
      summary: Readiness check
      description: >-
        Database ping. Served at the process root (`/readyz`). Used as the
        Kubernetes readiness probe: a failed ping removes the pod from
        service and does not restart it.
      responses:
        "200":
          description: Database accepted a ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database did not accept a ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /ingestion/freshness:
    get:
      operationId: getIngestionFreshness
      tags: [health]
      summary: Newest speech and vote dates, and the last run of each ingestion job
      description: >-
        Public operational report. Dates are the newest record held, not an
        ingest timestamp. `alerts` is what the daily chain also logs at error
        when a threshold is crossed. Worker error text is not included.
      responses:
        "200":
          description: Freshness report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionFreshness"
        "500":
          description: The report could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /aendringslogg:
    get:
      operationId: listAendringslogg
      tags: [aendringslogg]
      summary: What changed and when (Ändringslogg), newest first
      description: >
        Public and read-only. Request keys and tokens are never served.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: Return only entries with an id lower than this (paging)
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AendringsloggEntry"

  /write/valmanifest:
    post:
      operationId: upsertValmanifest
      tags: [write]
      summary: Create or update a Valmanifest (key - party, electionYear, title)
      description: >
        Idempotent by Idempotency-Key. The change and its Ändringslogg entry
        are written in one transaction. Repeating the request returns the
        original entry (header Idempotent-Replayed - true) and changes nothing.
        A request that matches the stored value changes nothing and is not
        logged (changed - false). When no write token is configured the route
        does not exist and answers 404.
      security:
        - writeToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValmanifestWrite"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "400":
          description: Malformed JSON or unknown field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Write API not configured
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /write/aendringslogg/{id}/undo:
    post:
      operationId: undoAendringslogg
      tags: [write]
      summary: Undo an Ändringslogg entry; the undo is logged as a new entry
      description: >
        Restores the entry's old value, provided the entity still holds the
        value the entry wrote. If it changed since, nothing happens and the
        answer is 409. Idempotent by Idempotency-Key.
      security:
        - writeToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Provenance"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "400":
          description: Malformed JSON, unknown field or invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Write API not configured, or no such entry
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /write/candidates:
    get:
      operationId: getKopplingCandidates
      tags: [write]
      summary: Candidate voteringar new since the last Veckobatch, with the approved Löften they might test
      description: >
        Behind the write token. Decided voteringar ingested after the creation of the last closed Veckobatch (all of them when none is closed), inside the mandate period of an approved Löfte whose utskott matches the votering's (the letters of its beteckning). Pairs already suggested, in any state, are left out. Each votering carries its betänkande, förslagspunkt and the motions and yrkanden decided there. Page by passing the response's `next` as `after`.
      security:
        - writeToken: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: after, in: query, description: Cursor from the previous page's `next`, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KopplingCandidates" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /write/kopplingar:
    post:
      operationId: submitKopplingSuggestions
      tags: [write]
      summary: Submit Föreslagna kopplingar (Löfte, votering, direction, confidence, reasoning)
      description: >
        Suggestions at or above `threshold` (default 0.6) are stored as foreslagen; below it as bortsorterad, which is kept only so the pair is not suggested again. Neither is ever returned by a public endpoint or shown in the public Ändringslogg. All-or-nothing: an unknown votering, a Löfte that is not approved, or a votering outside the Löfte's mandate period (for a 2026 Löfte, 2026–2030) is 422 and stores nothing. A pair that already has a koppling is reported as `existing` and left unchanged.
      security:
        - writeToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KopplingSuggestionsWrite" }
      responses:
        "200":
          description: One result per suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KopplingSuggestionsResult" }
        "400":
          description: Malformed JSON or unknown field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /write/motion-kopplingar:
    post:
      operationId: submitMotionKopplingSuggestions
      tags: [write]
      summary: Suggest curated motion links (a fråga that cites a motion only in prose; yrkanden of different wording that are the same Återkommande krav)
      description: >
        Suggestions at or above `threshold` (default 0.6) are stored as foreslagen; below it as bortsorterad, kept only so the pair is not suggested again. They join the same numbered Veckobatch as Löfte kopplingar (`kind` "fraga" or "krav" on the item). A link becomes public only when the Redaktör answers ja; suggested, rejected and undone links are never returned by a public endpoint or shown in the public Ändringslogg. All-or-nothing: an unknown question, motion or yrkande is 422 and stores nothing. A pair that already exists (a krav pair in either order) is reported as `existing` and left unchanged. "ja men omvänt" has no meaning for these items and is 422.
      security:
        - writeToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotionKopplingSuggestionsWrite" }
      responses:
        "200":
          description: One result per suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionKopplingSuggestionsResult" }
        "400":
          description: Malformed JSON or unknown field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /write/veckobatch:
    post:
      operationId: createVeckobatch
      tags: [write]
      summary: Create the week's Veckobatch from the strongest open suggestions (at most 20)
      description: >
        Takes foreslagen kopplingar, those left unanswered by earlier batches first, then strongest first, and numbers them 1..N. The numbers never change afterwards. Creating a batch closes the previous one (which moves the `since` cutoff of /write/candidates). Decides nothing. 422 when there are no open suggestions. Idempotent on the Idempotency-Key. Logged in the Ändringslogg; never public.
      security:
        - writeToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chatRef, onBehalfOf]
              additionalProperties: false
              properties:
                max: { type: integer, minimum: 1, maximum: 20, default: 20 }
                chatRef: { type: string }
                onBehalfOf: { type: string }
      responses:
        "200": { description: The batch with its numbered items, content: { application/json: { schema: { $ref: "#/components/schemas/Veckobatch" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /write/veckobatch/latest:
    get:
      operationId: getLatestVeckobatch
      tags: [write]
      summary: The newest Veckobatch with its items and answers
      security:
        - writeToken: []
      responses:
        "200": { description: The batch, content: { application/json: { schema: { $ref: "#/components/schemas/Veckobatch" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No Veckobatch exists yet }

  /write/veckobatch/{id}:
    get:
      operationId: getVeckobatch
      tags: [write]
      summary: A Veckobatch with its items and answers
      security:
        - writeToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The batch, content: { application/json: { schema: { $ref: "#/components/schemas/Veckobatch" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown batch }

  /write/veckobatch/{id}/answers:
    post:
      operationId: answerVeckobatch
      tags: [write]
      summary: Submit the Redaktör's short-form answer to a Veckobatch, atomically
      description: >
        Give `text` (the chat sentence, parsed strictly: "1,3,7 ja, resten nej", "4 ja men omvänt"; anything unrecognised is 422) or `answers` (+ optional `rest`). ja confirms the koppling (Bekräftad koppling) with the suggested direction, ja-omvaent confirms it with the direction reversed, nej rejects it. All named items are decided in one transaction or none is (422 for an unknown item, 409 for an already answered item or a closed batch). Items neither named nor covered by `rest` stay open and roll into the next batch. One Ändringslogg entry per decision, each undoable through POST /write/aendringslogg/{id}/undo. Idempotent on the Idempotency-Key.
      security:
        - writeToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chatRef, onBehalfOf]
              additionalProperties: false
              properties:
                text: { type: string }
                answers:
                  type: array
                  items:
                    type: object
                    required: [nr, answer]
                    additionalProperties: false
                    properties:
                      nr: { type: integer, minimum: 1 }
                      answer: { type: string, enum: [ja, nej, ja-omvaent] }
                rest: { type: string, enum: [ja, nej, ja-omvaent] }
                chatRef: { type: string }
                onBehalfOf: { type: string }
      responses:
        "200":
          description: What was decided and what is still open
          content:
            application/json:
              schema:
                type: object
                required: [replayed, decided, unanswered, closed]
                properties:
                  replayed: { type: boolean }
                  decided:
                    type: array
                    items:
                      type: object
                      required: [nr, kind, kopplingId, answer, state, direction, entryId]
                      properties:
                        nr: { type: integer }
                        kind: { type: string, enum: [loefte, fraga, krav] }
                        kopplingId: { type: integer, format: int64 }
                        motionKopplingId: { type: integer, format: int64, description: "Set for kind fraga and krav" }
                        answer: { type: string, enum: [ja, nej, ja-omvaent] }
                        state: { type: string, enum: [bekraftad, avvisad] }
                        direction: { type: string, enum: [Ja, Nej] }
                        entryId: { type: integer, format: int64 }
                  unanswered: { type: array, items: { type: integer } }
                  closed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown batch }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /write/loften:
    post:
      operationId: proposeLoefte
      tags: [write]
      summary: Propose a Löfte (stored as proposed, never public)
      description: >
        A Löfte without quote or sourceUrl is rejected (422). The Valmanifest must belong to the party. The same quote cannot be proposed twice unless the earlier one was struck (409). Logged in the Ändringslogg, but a proposed Löfte never appears in the public log.
      security:
        - writeToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoefteProposalWrite"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "400":
          description: Malformed JSON, unknown field or invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Write API not configured, or no such Löfte
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /write/loften/{id}:
    post:
      operationId: editLoefte
      tags: [write]
      summary: Edit a proposed or approved Löfte
      description: >
        Replaces text, quote, locator, sourceUrl, topic, specificity and utskott. Quote and sourceUrl stay mandatory. Struck and archived Löften cannot be edited (409).
      security:
        - writeToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoefteEditWrite"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "400":
          description: Malformed JSON, unknown field or invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Write API not configured, or no such Löfte
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /write/loften/{id}/approve:
    post:
      operationId: approveLoefte
      tags: [write]
      summary: Approve a proposed Löfte (makes it public)
      description: >
        The Redaktör's decision, recorded with onBehalfOf and chatRef. Approving an approved Löfte changes nothing. A struck or archived Löfte cannot be approved (409).
      security:
        - writeToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Provenance"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "400":
          description: Malformed JSON, unknown field or invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Write API not configured, or no such Löfte
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /write/loften/{id}/strike:
    post:
      operationId: strikeLoefte
      tags: [write]
      summary: Strike a Löfte (withdraws it from the public view)
      description: >
        The row is kept as struck so the decision is traceable. Striking a struck Löfte changes nothing.
      security:
        - writeToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Provenance"
      responses:
        "200":
          $ref: "#/components/responses/WriteResult"
        "400":
          description: Malformed JSON, unknown field or invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Write API not configured, or no such Löfte
        "409":
          $ref: "#/components/responses/WriteConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /loften:
    get:
      operationId: listLoften
      tags: [loften]
      summary: Public Löften (approved and archived), optionally for one party
      description: >
        Proposed and struck Löften are never returned. Each carries its
        Löftesstatus, computed on read from Bekräftade kopplingar and the
        party's Partilinje (ADR-002). Archived Löften have status null.
      parameters:
        - name: party
          in: query
          schema:
            type: string
        - name: utskott
          in: query
          description: Utskott code, e.g. SkU
          schema:
            type: string
        - name: betankande
          in: query
          description: >
            Only Löften with a Bekräftad koppling to a votering of this
            betänkande, written riksmöte:beteckning (2026/27:SkU2). This is
            what "berör N löften" links to.
          schema:
            type: string
            example: "2026/27:SkU2"
        - name: status
          in: query
          description: Filter by Löftesstatus; "arkiv" selects archived Löften (no status)
          schema:
            type: string
            enum: [for, emot, blandat, inte-provat, arkiv]
      responses:
        "200":
          description: Public Löften
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoefteMedStatus"
        "400":
          description: Invalid party, utskott or status

  /loften/summary:
    get:
      operationId: getLoftenSummary
      tags: [loften]
      summary: Per party, how many public Löften have each Löftesstatus
      responses:
        "200":
          description: One row per party
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoftePartySummary"

  /loften/{id}/kopplingar:
    get:
      operationId: listLoefteKopplingar
      tags: [loften]
      summary: The Bekräftade kopplingar behind a Löfte's status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bekräftade kopplingar, oldest confirmation first. Never föreslagna, avvisade or bortsorterade ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BekraftadKoppling"
        "404":
          $ref: "#/components/responses/NotFound"

  /kopplingar/{id}:
    get:
      operationId: getKoppling
      tags: [loften]
      summary: One Bekräftad koppling at its stable id. Any other koppling is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The koppling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BekraftadKoppling"
        "404":
          $ref: "#/components/responses/NotFound"

  /loften/{id}:
    get:
      operationId: getLoefte
      tags: [loften]
      summary: One public Löfte with Löftesstatus and its Bekräftade kopplingar. Archived 2022 Löften keep their old goal id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The Löfte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoefteMedStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /parties/{party}/loften:
    get:
      operationId: listPartyLoften
      tags: [loften]
      summary: Public Löften for one party
      parameters:
        - $ref: "#/components/parameters/PartyParam"
      responses:
        "200":
          description: Public Löften
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoefteMedStatus"

  /valmanifest:
    get:
      operationId: listValmanifest
      tags: [loften]
      summary: Every Valmanifest, newest election first
      parameters:
        - name: party
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Valmanifest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Valmanifest"

  /parties/{party}/valmanifest:
    get:
      operationId: listPartyValmanifest
      tags: [loften]
      summary: A party's Valmanifest, listed as sources
      parameters:
        - $ref: "#/components/parameters/PartyParam"
      responses:
        "200":
          description: Valmanifest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Valmanifest"

  /politicians:
    get:
      operationId: listPoliticians
      tags: [politicians]
      summary: List politicians with summary statistics
      parameters:
        - name: party
          in: query
          schema:
            $ref: "#/components/schemas/PartyCode"
        - name: active
          in: query
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list of politicians
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliticianListResponse"

  /politicians/{id}:
    get:
      operationId: getPolitician
      tags: [politicians]
      summary: Full politician profile
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
      responses:
        "200":
          description: Politician profile with statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliticianProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians/{id}/votes:
    get:
      operationId: listPoliticianVotes
      tags: [politicians]
      summary: Voting record with proposal origin context
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
        - name: session
          in: query
          schema:
            type: string
            example: "2024/25"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/Topic"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Voting record with proposal origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /votes:
    get:
      operationId: listDistinctVotes
      tags: [votes]
      summary: Distinct vote points, newest first (matching projection)
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Paginated list of distinct beteckning/förslagspunkt pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteSummaryListResponse"

  /beslut:
    get:
      operationId: listBeslut
      tags: [motions]
      summary: Beslut list — betänkanden coming up and decided, with filters
      description: >-
        Upcoming betänkanden come first, the soonest planned beslutsdag first
        (undated ones last), then decided ones, newest decision first.
        Whether a row is decided is Riksdagen's own: `beslutad`, else status
        and `beslutsdag` (the same rule as the betänkande page). A planned
        betänkande is never listed as decided. `party` matches a betänkande
        that decides a motion signed by the party or has a reservation by it.
        Each of `utskott` and `party` takes several values, repeated or
        comma-separated. Paginate with `nextCursor`.
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [decided, upcoming] } }
        - { name: author, in: query, required: false, description: "Signer politician id (intressent_id); several allowed", schema: { type: string } }
        - { name: utskott, in: query, required: false, description: "Utskott code, e.g. `SkU`", schema: { type: string } }
        - { name: party, in: query, required: false, description: "Party, e.g. `M`", schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, description: "Opaque `nextCursor` of the previous page", schema: { type: string } }
      responses:
        "200":
          description: One page of betänkanden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeslutListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /parties/{party}/record:
    get:
      operationId: getPartyRecord
      tags: [motions]
      summary: A party's recent decisions (with its Partilinje) and its Kommittémotioner (with outcomes)
      description: >-
        `decisions` are the party's ten most recently decided betänkanden: those
        that decide a motion signed by the party, carry a reservation by it, or
        were voted on by it. `partilinje` is the party's own line (see
        BeslutPartyLine), empty when no member cast a ballot (decided without
        votering). `motions` are the party's Kommittémotioner, most recently
        decided first, each with its outcome.
      parameters:
        - { name: party, in: path, required: true, description: "Party, e.g. `M`", schema: { type: string } }
      responses:
        "200":
          description: The party's record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyRecord"
        "400":
          $ref: "#/components/responses/BadRequest"

  /frontpage:
    get:
      operationId: getFrontPage
      tags: [motions]
      summary: Front-page feed — newest decided betänkanden, recent motion outcomes, next planned betänkanden
      description: >-
        Up to 5 decided betänkanden (newest decision first, each with the
        eight parties' Partilinje), up to 5 recently decided motions and up
        to 3 upcoming betänkanden (soonest beslutsdag first). Decided is
        Riksdagen's own rule (`beslutad`, else status and `beslutsdag`);
        a planned betänkande is never in `decided`. `coverage` gives the
        dates the decided rows cover; `stale` is true when the newest
        decision is before the start (Monday) of the current week.
      responses:
        "200":
          description: The feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrontPageResponse"

  /data/coverage:
    get:
      operationId: getDataCoverage
      tags: [data]
      summary: Per source and riksmöte, whether it is loaded and when it last changed
      description: >-
        One row per source (`motioner`, `betankanden`, `voteringar`,
        `anforanden`, `fragor`, `interpellationer`) and riksmöte that has an
        ingestion coverage record, newest riksmöte first. A riksmöte without a
        row has not been read. `status` is `complete` when the backfill marked it
        finished or what we hold reaches what Riksdagen reports, else `partial`.
        `lastUpdate` is the newest timestamp on the coverage record.
      responses:
        "200":
          description: Coverage rows
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DataCoverage" }

  /questions/coverage:
    get:
      operationId: getQuestionCoverage
      tags: [motions]
      summary: What Riksdagen lists per riksmöte and kind of fråga, and how many we hold
      responses:
        "200":
          description: Coverage rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage:
                    type: array
                    items: { $ref: "#/components/schemas/QuestionCoverage" }

  /questions/{kind}/{riksmote}/{beteckning}:
    get:
      operationId: getQuestion
      tags: [motions]
      summary: One skriftlig fråga (with its svar) or interpellation
      description: >-
        Includes the motions it is linked to with the rule behind each link,
        and for an interpellation the anföranden of its debate (found by
        avsnittsrubrik and the day it was answered).
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [fraga, interpellation] } }
        - { name: riksmote, in: path, required: true, description: "URL-encoded, e.g. `2022%2F23`", schema: { type: string } }
        - { name: beteckning, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The question
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionDetail" }
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians/{id}/questions:
    get:
      operationId: listMemberQuestions
      tags: [motions]
      summary: Frågor and interpellationer a member asked or, for a minister, answered
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Questions, newest first; `role` is `asker` or `answerer`
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/QuestionItem" }

  /motions/{riksmote}/{beteckning}/questions:
    get:
      operationId: listMotionQuestions
      tags: [motions]
      summary: Frågor and interpellationer linked to a motion
      description: >-
        A link exists only when Riksdagen's reference points at the motion
        (`riksdagen-reference`) or the question text cites its beteckning
        (`cited-beteckning`). A motion named only in prose is not linked.
      parameters:
        - { name: riksmote, in: path, required: true, schema: { type: string } }
        - { name: beteckning, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Linked questions, each with its `rule`
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/QuestionItem" }

  /motions:
    get:
      operationId: listMotions
      tags: [motions]
      summary: Motions, most recently decided first, with filters and free-text search
      description: >-
        Undecided motions come after the decided ones, newest filing first.
        "Decided" is the date of the newest betänkande that decided one of the
        motion's yrkanden (Riksdagen's last-changed date for it). The
        `utskott` filter matches the utskott a motion is filed to and the
        utskott whose betänkande decided one of its yrkanden. `party` matches
        any signer. Each filter takes several values, repeated or
        comma-separated; values of one filter are alternatives, filters are
        combined with AND. Paginate with `nextCursor`; a page can be shorter
        than `limit` while `nextCursor` is set, when an `outcome` filter
        matches rarely.
      parameters:
        - { name: party, in: query, required: false, description: "Signer party, e.g. `M`", schema: { type: string } }
        - { name: utskott, in: query, required: false, description: "Utskott code, e.g. `SkU`", schema: { type: string } }
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            description: "One or more of Avslagen, Bifallen, Delvis bifallen, Besvarad, Ej avgjord än, Blandat utfall"
        - { name: riksmote, in: query, required: false, description: "Riksmöte in slash form, `2017/18`; several allowed", schema: { type: string, example: "2017/18,2021/22" } }
        - name: kind
          in: query
          required: false
          schema:
            type: string
            description: "One or more of Kommittémotion, Partimotion, Enskild motion, Flerpartimotion"
        - { name: q, in: query, required: false, description: "Free text over title and yrkande wording; every word must match", schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, description: "Opaque `nextCursor` of the previous page", schema: { type: string } }
      responses:
        "200":
          description: One page of motions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /motions/coverage:
    get:
      operationId: getMotionCoverage
      tags: [motions]
      summary: What Riksdagen's listing reports per riksmöte and source, and how many motions we hold
      responses:
        "200":
          description: One row per riksmöte and source, newest riksmöte first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MotionCoverage"

  /motions/backfill:
    get:
      operationId: getMotionBackfill
      tags: [motions]
      summary: Which riksmöten the operator's backfill has finished, per source
      description: >-
        One row per riksmöte and source (`motioner`, `betankanden`) the backfill
        command has worked on. `complete` is true when every motion the listing
        reports is held (`motioner`) or no betänkande the riksmöte's motions point
        at is left to read (`betankanden`).
      responses:
        "200":
          description: One row per riksmöte and source, newest riksmöte first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MotionBackfill"

  /motions/{riksmote}/{beteckning}:
    get:
      operationId: getMotion
      tags: [motions]
      summary: One motion with its authors and every yrkande
      parameters:
        - name: riksmote
          in: path
          required: true
          description: >-
            Riksmöte in slash form, `2017/18`, never `2017-18`. It sits in one
            path segment, so the slash is URL-encoded as `2017%2F18`.
          schema:
            type: string
            pattern: '^\d{4}/\d{2}$'
            example: "2017/18"
        - name: beteckning
          in: path
          required: true
          schema:
            type: string
            example: "3293"
      responses:
        "200":
          description: The motion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Motion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No motion with that riksmöte and beteckning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /betankanden/resolve:
    get:
      operationId: resolveBetankande
      tags: [motions]
      summary: Which riksmöte an old betänkande or vote URL belongs to
      description: >-
        Backs the redirects. With `punkt` (a vote detail URL) the riksmöte is
        the votering's own; without `rm` it is the most recent riksmöte that
        holds the beteckning.
      parameters:
        - { name: beteckning, in: query, required: true, schema: { type: string, example: "SkU16" } }
        - { name: punkt, in: query, required: false, schema: { type: string, example: "6" } }
        - { name: rm, in: query, required: false, description: "Riksmöte in slash form, 2025/26", schema: { type: string, example: "2025/26" } }
      responses:
        "200":
          description: The canonical riksmöte
          content:
            application/json:
              schema:
                type: object
                required: [riksmote, beteckning, punkt]
                properties:
                  riksmote: { type: string, example: "2025/26" }
                  beteckning: { type: string }
                  punkt: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No betänkande or votering with that beteckning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /betankanden/{riksmote}/{beteckning}:
    get:
      operationId: getBetankande
      tags: [motions]
      summary: The canonical betänkande page, keyed by riksmöte + beteckning
      parameters:
        - name: riksmote
          in: path
          required: true
          description: >-
            Riksmöte in slash form, `2025/26`, never `2025-26`. It sits in one
            path segment, so the slash is URL-encoded as `2025%2F26`.
          schema:
            type: string
            pattern: '^\d{4}/\d{2}$'
            example: "2025/26"
        - name: beteckning
          in: path
          required: true
          schema: { type: string, example: "SkU16" }
      responses:
        "200":
          description: The betänkande with every förslagspunkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetankandePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Not stored, not voted and not listed by Riksdagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /votes/recent:
    get:
      operationId: getRecentBetankanden
      tags: [votes]
      summary: Complete, dated feed of recent betänkanden across every committee
      description: >-
        No committee filter is applied. Riksdagen ignores the `organ`
        parameter on the underlying /dokumentlista endpoint, so a curated
        subset would only look filtered — this endpoint returns the same
        complete feed and states that plainly.
      parameters:
        - name: count
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 40
      responses:
        "200":
          description: Recent betänkanden, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentBetankande"

  /votes/{beteckning}/{punkt}:
    get:
      operationId: getVoteDetail
      tags: [votes]
      summary: Full vote detail with proposal origin and all party positions
      parameters:
        - name: beteckning
          in: path
          required: true
          schema:
            type: string
            example: "SoU12"
        - name: punkt
          in: path
          required: true
          schema:
            type: string
            example: "1"
        - name: session
          in: query
          required: false
          description: >-
            Riksmöte, e.g. "2026/27". When set, ballots and the live document
            lookup are limited to that session. Beteckning numbering restarts
            each riksmöte, so the same beteckning and punkt exist in several.
            When omitted, the answer is the latest riksmöte holding that
            punkt — always one riksmöte, never a blend — and the response's
            `session` says which.
          schema:
            type: string
            example: "2026/27"
      responses:
        "200":
          description: Full vote detail with party breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/{dokId}/full:
    get:
      operationId: getDocumentFull
      tags: [votes]
      summary: Full Riksdagen document — body HTML + intressenter list
      parameters:
        - name: dokId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full document with body and participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiksdagDocumentFull"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/{dokId}:
    get:
      operationId: getDocument
      tags: [votes]
      summary: Riksdagen document metadata (no body HTML)
      parameters:
        - name: dokId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parsed dokumentstatus metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiksdagDocument"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/years:
    get:
      operationId: listBudgetYears
      tags: [budget]
      summary: List all available budget years with totals
      responses:
        "200":
          description: Budget years with total amounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetYear"

  /budget/years/{year}:
    get:
      operationId: getBudgetYear
      tags: [budget]
      summary: Full budget breakdown for a specific year
      parameters:
        - $ref: "#/components/parameters/BudgetYearParam"
      responses:
        "200":
          description: Budget year with all expenditure area allocations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetYearDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/years/{year}/compare/{compareYear}:
    get:
      operationId: compareBudgetYears
      tags: [budget]
      summary: Side-by-side comparison of two budget years with deltas
      parameters:
        - $ref: "#/components/parameters/BudgetYearParam"
        - name: compareYear
          in: path
          required: true
          schema:
            type: integer
            example: 2024
      responses:
        "200":
          description: Comparison with delta amounts and percentages per area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetComparison"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/areas:
    get:
      operationId: listExpenditureAreas
      tags: [budget]
      summary: List all 27 expenditure areas
      responses:
        "200":
