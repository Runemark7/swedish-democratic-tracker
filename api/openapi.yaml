      type: object
      properties:
        code:        { type: string }
        name:        { type: string }
        foundedYear: { type: integer, nullable: true }
        ideology:    { type: string, nullable: true }
        colorHex:    { type: string }
        textHex:     { type: string }
        active:      { type: boolean }
        websiteUrl:  { type: string, nullable: true }
        createdAt:   { type: string, format: date-time }

