  /committees:
    get:
      operationId: listCommittees
      summary: Committees that decided at least one votering in a mandate period
      tags: [committees]
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string }
          description: Mandate period code, e.g. "2022-2026".
      responses:
        "200":
          description: >-
            Committees, alphabetical by code. expenditureAreas is empty here —
            only GET /committees/{code} populates it.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Committee" }
        "404":
          description: >-
            No such mandate period. A period we do not hold is refused rather
            than answered with an empty list, which would read as "this
            parliament decided nothing".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /committees/{code}:
    get:
      operationId: getCommittee
      summary: One committee with the utgiftsområden it bereder
      tags: [committees]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          description: >-
            Committee code, matched case-insensitively — "fiu" and "FiU" are the
            same committee.
        - name: period
          in: query
          required: true
          schema: { type: string }
        - name: year
          in: query
          required: false
          schema: { type: integer }
          description: >-
            Budget year for the amounts. Defaults to the newest year with
            decided figures. A year without decided figures is a 400, never a
            200 carrying zero amounts.
      responses:
        "200":
          description: The committee, with the utgiftsområden it bereder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Committee" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such mandate period, or that committee decided nothing in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /committees/{code}/votes:
    get:
      operationId: listVotesByCommittee
      summary: Voteringar decided by this committee, with each party's position
      description: >-
        The RÖSTAT row. Each item is one förslagspunkt with the dominant
        position every party took, stated as fact only, alphabetical by party
        within a votering, no share or rank. A party appears as "Delad" when
        its members split evenly between two or more positions, rather than
        the record silently picking one. Ballots cast under no party
        affiliation ("-") are excluded — they remain in the record and on the
        decision page, they simply do not occupy a party's slot here. Carries
        no decision date: votes hold only system_datum, which is when
        Riksdagen last touched the record, so the record cannot be shown in
        chronological order. Ordered by riksmöte, then the numeric part of the
        beteckning, then the numeric förslagspunkt.
      tags: [committees]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          description: >-
            Committee code, matched case-insensitively — "sou" and "SoU" are
            the same committee.
        - name: period
          in: query
          required: true
          schema: { type: string }
          description: >-
            Mandate period code, e.g. "2022-2026" — required for the same
            reason GET /committees/{code} requires it: an unscoped query would
            blend mandate periods together the moment the record holds more
            than one.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of voteringar plus the total for the committee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitteeVoteringPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: >-
            No such mandate period. A period we do not hold is refused rather
            than answered with an empty page, which would read as "this
            committee decided nothing".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    writeToken:
      type: http
      scheme: bearer
      description: Token from a Kubernetes Secret; held only by the bot.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per intended change (max 200 characters). Reusing it for a different request answers 409.
      schema: { type: string, maxLength: 200 }
    PartyParam:
      name: party
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PartyCode"
    PoliticianIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: Riksdagen intressent_id
    BudgetYearParam:
      name: year
      in: path
      required: true
      schema:
        type: integer
        example: 2025

  responses:
    WriteResult:
      description: Applied, replayed, or unchanged
      headers:
        Idempotent-Replayed:
          description: "true when this is the stored answer to an earlier request with the same key"
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WriteResult" }
    Unauthorized:
      description: Missing or wrong bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WriteError" }
    ValidationFailed:
      description: The request is well-formed JSON but fails validation (including a missing Idempotency-Key)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WriteError" }
    WriteConflict:
      description: >
        code "conflict" - an undo of a since-changed value, or a collision with other data;
        code "idempotency_key_reused" - the key belongs to a different request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WriteError" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Veckobatch:
      type: object
      required: [id, createdAt, closedAt, items]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        replayed: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [nr, kind, kopplingId, state, rolledOver, loefteId, party, loefteText, quote, locator, sourceUrl, voteringId, beteckning, forslagspunkt, betankande, datum, direction, confidence, reasoning, answer]
            properties:
              nr: { type: integer }
              kind: { type: string, enum: [loefte, fraga, krav], description: "loefte = a Löfte↔votering koppling; fraga and krav = a curated motion link, described in `motion` (the Löfte and votering fields are then empty)" }
              kopplingId: { type: integer, format: int64, description: "0 for a motion link" }
              motionKopplingId: { type: integer, format: int64, description: "Set for kind fraga and krav" }
              motion:
                type: object
                description: Present for kind fraga and krav
                required: [kind, rule, motion]
                properties:
                  kind: { type: string, enum: [fraga, krav] }
                  rule: { type: string, enum: [prose-citation, similar-wording] }
                  question:
                    type: object
                    description: kind fraga
                    properties:
                      kind: { type: string }
                      riksmote: { type: string }
                      beteckning: { type: string }
                      title: { type: string }
                      asker: { type: string }
                      excerpt: { type: string }
                      sourceUrl: { type: string }
                  motion: { $ref: "#/components/schemas/CuratedMotionView" }
                  other: { $ref: "#/components/schemas/CuratedMotionView" }
              state: { type: string }
              rolledOver: { type: boolean }
              loefteId: { type: integer, format: int64 }
              party: { type: string }
              loefteText: { type: string }
              quote: { type: string }
              locator: { type: string }
              sourceUrl: { type: string }
              voteringId: { type: string }
              beteckning: { type: string }
              forslagspunkt: { type: string }
              betankande: { type: string }
              datum: { type: string, nullable: true }
              direction: { type: string, enum: [Ja, Nej] }
              confidence: { type: number }
              reasoning: { type: string }
              answer: { type: string, nullable: true, enum: [ja, nej, ja-omvaent] }
    CuratedMotionView:
      type: object
      properties:
        riksmote: { type: string }
        beteckning: { type: string }
        title: { type: string }
        parties: { type: array, items: { type: string } }
        yrkande: { type: integer, description: "kind krav only" }
        wording: { type: string, description: "kind krav only" }
        sourceUrl: { type: string }
    MotionKopplingSuggestionsWrite:
      type: object
      required: [suggestions, chatRef, onBehalfOf]
      additionalProperties: false
      properties:
        threshold: { type: number, minimum: 0, maximum: 1, default: 0.6 }
        suggestions:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [kind, motion, confidence, reasoning]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [fraga, krav] }
              question:
                type: object
                description: kind fraga - the fråga or interpellation that cites the motion in prose
                required: [kind, riksmote, beteckning]
                additionalProperties: false
                properties:
                  kind: { type: string, enum: [fraga, interpellation] }
                  riksmote: { type: string, example: "2022/23" }
                  beteckning: { type: string, example: "339" }
              motion:
                type: object
                description: kind fraga - the cited motion; kind krav - the first yrkande (give `yrkande`)
                required: [riksmote, beteckning]
                additionalProperties: false
                properties:
                  riksmote: { type: string, example: "2017/18" }
                  beteckning: { type: string, example: "3293" }
                  yrkande: { type: integer, minimum: 1 }
              other:
                type: object
                description: kind krav - the second yrkande
                required: [riksmote, beteckning, yrkande]
                additionalProperties: false
                properties:
                  riksmote: { type: string }
                  beteckning: { type: string }
                  yrkande: { type: integer, minimum: 1 }
              confidence: { type: number, minimum: 0, maximum: 1 }
              reasoning: { type: string, maxLength: 4000 }
        chatRef: { type: string }
        onBehalfOf: { type: string }
    MotionKopplingSuggestionsResult:
      type: object
      required: [replayed, results]
      properties:
        replayed: { type: boolean }
        results:
          type: array
          items:
            type: object
            required: [motionKopplingId, kind, state, status]
            properties:
              motionKopplingId: { type: integer, format: int64 }
              kind: { type: string, enum: [fraga, krav] }
              state: { type: string, enum: [foreslagen, bortsorterad, bekraftad, avvisad] }
              status: { type: string, enum: [created, existing] }
    KopplingSuggestionsWrite:
      type: object
      required: [suggestions, chatRef, onBehalfOf]
      additionalProperties: false
      properties:
        threshold: { type: number, minimum: 0, maximum: 1, default: 0.6 }
        suggestions:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [loefteId, voteringId, direction, confidence, reasoning]
            additionalProperties: false
            properties:
              loefteId: { type: integer, format: int64 }
              voteringId: { type: string, description: "Riksdagen's votering_id" }
              direction: { type: string, enum: [Ja, Nej], description: The ballot that is in the Löfte's direction }
              confidence: { type: number, minimum: 0, maximum: 1 }
              reasoning: { type: string, maxLength: 4000 }
        chatRef: { type: string }
        onBehalfOf: { type: string }
    KopplingSuggestionsResult:
      type: object
      required: [replayed, results]
      properties:
        replayed: { type: boolean }
        results:
          type: array
          items:
            type: object
            required: [kopplingId, loefteId, voteringId, state, status]
            properties:
              kopplingId: { type: integer, format: int64 }
              loefteId: { type: integer, format: int64 }
              voteringId: { type: string }
              state: { type: string, enum: [foreslagen, bortsorterad, bekraftad, avvisad] }
              status: { type: string, enum: [created, existing] }
    KopplingCandidates:
      type: object
      required: [since, voteringar, next]
      properties:
        since: { type: string, format: date-time, nullable: true, description: created_at of the last closed Veckobatch }
        next: { type: integer, format: int64, nullable: true, description: Pass as `after` for the next page; null on the last page }
        voteringar:
          type: array
          items:
            type: object
            required: [voteringId, beteckning, forslagspunkt, session, utskott, betankande, motions, loften]
            properties:
              voteringId: { type: string }
              beteckning: { type: string }
              forslagspunkt: { type: string }
              session: { type: string }
              datum: { type: string, format: date-time, nullable: true }
              utskott: { type: string }
              betankande:
                type: object
                description: Empty strings when the betänkande is not ingested yet
                properties:
                  riksmote: { type: string }
                  beteckning: { type: string }
                  title: { type: string }
                  punkt: { type: string }
                  rubrik: { type: string }
                  forslagText: { type: string }
                  alternativ: { type: string }
              motions:
                type: array
                items:
                  type: object
                  properties:
                    riksmote: { type: string }
                    beteckning: { type: string }
                    title: { type: string }
                    party: { type: string }
                    yrkande: { type: integer }
                    wording: { type: string }
              loften:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    party: { type: string }
                    text: { type: string }
                    quote: { type: string }
                    locator: { type: string }
                    sourceUrl: { type: string }
                    topic: { type: string }
                    utskott: { type: array, items: { type: string } }
    WriteError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [bad_request, unauthorized, validation, not_found, conflict, idempotency_key_reused, internal]
    Provenance:
      type: object
      required: [onBehalfOf, chatRef]
      additionalProperties: false
      properties:
        onBehalfOf: { type: string, description: The Redaktör the bot acts for }
        chatRef: { type: string, description: Reference to the chat answer the change came from }
    ValmanifestWrite:
      type: object
      required: [party, electionYear, title, url, state, onBehalfOf, chatRef]
      additionalProperties: false
      properties:
        party: { type: string, example: M }
        electionYear: { type: integer }
        title: { type: string }
        publishedOn: { type: string, format: date }
        url: { type: string }
        pdfUrl: { type: string }
        state: { type: string, enum: [draft, final] }
        onBehalfOf: { type: string }
        chatRef: { type: string }
    LoefteFieldsWrite:
      type: object
      required: [text, quote, sourceUrl, onBehalfOf, chatRef]
      properties:
        text: { type: string, description: The testable claim, close to the source }
        quote: { type: string, description: The exact words of the Valmanifest }
        locator: { type: string, description: Page number or anchor }
        sourceUrl: { type: string, description: http(s) link to the original, page or anchor }
        topic: { type: string }
        specificity: { type: string, enum: [concrete, directional, rhetorical] }
        utskott: { type: array, items: { type: string } }
        onBehalfOf: { type: string }
        chatRef: { type: string }
    LoefteEditWrite:
      allOf:
        - $ref: "#/components/schemas/LoefteFieldsWrite"
    LoefteProposalWrite:
      allOf:
        - $ref: "#/components/schemas/LoefteFieldsWrite"
        - type: object
          required: [party, valmanifestId]
          properties:
            party: { type: string, example: S }
            valmanifestId: { type: integer, format: int64 }
            mandatePeriod: { type: string, example: 2026-2030, description: Defaults to 2026-2030 }
    AendringsloggEntry:
      type: object
      required: [id, createdAt, actor, onBehalfOf, chatRef, action, entity, entityId, oldValue, newValue, undoes]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        actor: { type: string }
        onBehalfOf: { type: string }
        chatRef: { type: string }
        action: { type: string, enum: [upsert, undo] }
        entity: { type: string, example: valmanifest }
        entityId: { type: integer, format: int64 }
        oldValue: { type: object, nullable: true, additionalProperties: true, description: null when the entity did not exist before }
        newValue: { type: object, nullable: true, additionalProperties: true, description: null when the entity does not exist after }
        undoes: { type: integer, format: int64, nullable: true }
        redacted:
          type: boolean
          description: >
            Public log only. True when oldValue or newValue was withheld because
            that side of the change was a proposed or struck Löfte. Changes
            where neither side was public are not listed at all.
    WriteResult:
      type: object
      required: [changed, replayed, entry]
      properties:
        changed: { type: boolean }
        replayed: { type: boolean }
        entry:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AendringsloggEntry"
    QuestionPerson:
      type: object
      required: [id, name, party]
      properties:
        id: { type: string }
        name: { type: string }
        party: { type: string }
    QuestionItem:
      type: object
      required: [dokId, kind, riksmote, beteckning, title, status, asker, addressed, answerer, answerDokId, sourceUrl]
      properties:
        dokId: { type: string }
        kind: { type: string, enum: [fraga, interpellation] }
        riksmote: { type: string }
        beteckning: { type: string }
        title: { type: string }
        askedDate: { type: string, format: date-time, nullable: true }
        status: { type: string }
        asker: { $ref: "#/components/schemas/QuestionPerson" }
        addressed: { $ref: "#/components/schemas/QuestionPerson" }
        answerer: { $ref: "#/components/schemas/QuestionPerson" }
        answerDate: { type: string, format: date-time, nullable: true }
        answerDokId: { type: string }
        role: { type: string, enum: [asker, answerer] }
        rule: { type: string, enum: [riksdagen-reference, cited-beteckning, redaktor-confirmed] }
        sourceUrl: { type: string }
    QuestionDetail:
      allOf:
        - $ref: "#/components/schemas/QuestionItem"
        - type: object
          properties:
            text: { type: string }
            motions:
              type: array
              items:
                type: object
                properties:
                  dokId: { type: string }
                  riksmote: { type: string }
                  beteckning: { type: string }
                  title: { type: string }
                  rule: { type: string }
            debate:
              type: array
              items:
                type: object
                properties:
                  speechId: { type: integer }
                  dokId: { type: string }
                  politicianId: { type: string }
                  name: { type: string }
                  party: { type: string }
                  date: { type: string, format: date-time }
                  excerpt: { type: string }
    DataCoverage:
      type: object
      required: [source, riksmote, status, expected, held, lastUpdate]
      properties:
        source: { type: string, enum: [motioner, betankanden, voteringar, anforanden, fragor, interpellationer] }
        riksmote: { type: string, example: "2021/22" }
        status: { type: string, enum: [complete, partial] }
        expected: { type: integer, description: "What Riksdagen's own listing reports" }
        held: { type: integer, description: "What we hold, counted live" }
        lastUpdate: { type: string, format: date-time }

    QuestionCoverage:
      type: object
      properties:
        riksmote: { type: string }
        kind: { type: string }
        expected: { type: integer }
        held: { type: integer }
        lastEnumeratedAt: { type: string, format: date-time }
    MotionCoverage:
      type: object
      required: [riksmote, source, expected, held, lastEnumeratedAt]
      properties:
        riksmote: { type: string, example: "2017/18" }
        source: { type: string, example: "riksdagen-dokumentlista" }
        expected: { type: integer, description: "Total Riksdagen's listing reports (@traffar)" }
        held: { type: integer, description: "Motions we hold for the riksmöte, counted at read time" }
        lastEnumeratedAt: { type: string, format: date-time }

    SpeechBackfill:
      type: object
      required: [riksmote, expected, stored, linked, unlinked, textBytes, rowsAdded, tableBytesAdded, indexBytesAdded, politiciansCreated, unresolvedSpeakers, complete, completedAt]
      properties:
        riksmote: { type: string, example: "2017/18" }
        expected: { type: integer, description: "Speeches the lists report for the riksmöte" }
        stored: { type: integer, description: "Speeches of the riksmöte we hold" }
        linked: { type: integer, description: "Stored speeches linked to a betänkande" }
        unlinked: { type: integer, description: "Stored speeches no betänkande could be named for" }
        textBytes: { type: integer, format: int64, description: "Bytes of speech text stored for the riksmöte" }
        rowsAdded: { type: integer, description: "Speech rows the backfill added" }
        tableBytesAdded: { type: integer, format: int64, description: "Growth of the speeches table (heap and TOAST) while the riksmöte was read in" }
        indexBytesAdded: { type: integer, format: int64, description: "Growth of the speeches indexes while the riksmöte was read in" }
        politiciansCreated: { type: integer, description: "Speakers created from Riksdagen's person data" }
        unresolvedSpeakers: { type: integer, description: "Speakers Riksdagen has no person for; their speeches are not stored" }
        complete: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }

    MotionBackfill:
      type: object
      required: [riksmote, source, expected, held, complete, completedAt]
      properties:
        riksmote: { type: string, example: "2017/18" }
        source: { type: string, enum: [motioner, betankanden] }
        expected: { type: integer, description: "Motions the listing reports, or betänkanden the riksmöte's motions point at" }
        held: { type: integer, description: "How many of those we hold" }
        complete: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }

    MotionAuthor:
      type: object
      required: [politicianId, name, party, role]
      properties:
        politicianId: { type: string }
        name: { type: string }
        party:
          type: string
          description: Party recorded on the motion when it was signed, not the member's party today
        role: { type: string, example: "undertecknare" }

    MotionYrkande:
      type: object
      required: [number, wording, utskottProposal, chamberDecision, behandlasI, behandlasIPunkt, outcome, decisions, recurring]
      properties:
        number: { type: integer }
        wording: { type: string, description: "Full wording of the demand, as Riksdagen gives it" }
        utskottProposal: { type: string, description: "The utskott's proposal as given, e.g. Avslag" }
        chamberDecision: { type: string, description: "The chamber's decision as given; empty before it decides" }
        behandlasI: { type: string, example: "2017/18:SkU11" }
        behandlasIPunkt: { type: string }
        outcome:
          type: string
          description: >-
            Avslagen, Bifallen, Delvis bifallen, Besvarad or Ej avgjord än; an
            unknown word is Riksdagen's own. A yrkande no förslagspunkt is
            linked to is Ej avgjord än.
        decisions:
          type: array
          description: The förslagspunkt(er) that decided the yrkande
          items: { $ref: "#/components/schemas/YrkandeDecision" }
        recurring:
          nullable: true
          description: >-
            The Återkommande krav the yrkande belongs to; null when its
            wording was filed in only one riksmöte.
          allOf:
            - $ref: "#/components/schemas/RecurringKrav"

    RecurringKrav:
      type: object
      required: [rule, ruleLabel, members]
      properties:
        rule: { type: string, enum: [identical_wording], description: "Phase 1 groups only by identical normalised wording" }
        ruleLabel: { type: string, example: "Identisk ordalydelse" }
        members:
          type: array
          description: Every stored filing of the demand, earliest riksmöte first
          items: { $ref: "#/components/schemas/RecurringMember" }

    RecurringMember:
      type: object
      required: [riksmote, beteckning, number, date, parties, outcome, rule, current, sourceUrl]
      properties:
        riksmote: { type: string, example: "2018/19" }
        beteckning: { type: string, example: "2900" }
        number: { type: integer, description: "Yrkande number within the motion" }
        date: { type: string, nullable: true, description: "Filing date, YYYY-MM-DD" }
        parties: { type: array, items: { type: string }, description: "Distinct parties among the signers" }
        outcome: { type: string, description: "Outcome word of this filing, as on the motion page" }
        rule: { type: string, enum: [identical_wording, redaktor-confirmed], description: "Why this filing is in the group; redaktor-confirmed = the Redaktör confirmed in a Veckobatch that it is the same demand in other words" }
        current: { type: boolean, description: "True for the yrkande the request is about" }
        sourceUrl: { type: string }

    PartyPartilinje:
      type: object
      required: [party, partilinje, ja, nej, avstar, franvarande]
      properties:
        party: { type: string }
        partilinje: { type: string, description: "Ja, Nej, Avstår or Delad; empty when the party has no Partilinje" }
        ja: { type: integer }
        nej: { type: integer }
        avstar: { type: integer }
        franvarande: { type: integer }

    YrkandeDecision:
      type: object
      required: [betankandeRiksmote, betankandeBeteckning, betankandeTitle, betankandeSourceUrl, loefteCount, loften, debate, punkt, rubrik, linkedBy, beslutstyp, mode, modeLabel, alternativ, outcome, voteringStored, voteringId, voteringUrl, parties, reasoning, reasoningAvailable, reservationsAvailable, reservations, sarskildaYttranden, votedReservation]
      properties:
        betankandeRiksmote: { type: string, example: "2017/18" }
        betankandeBeteckning: { type: string, example: "SkU11" }
        betankandeTitle: { type: string }
        betankandeSourceUrl: { type: string }
        loefteCount: { type: integer, description: "Berör N löften: public Löften with a Bekräftad koppling to a votering of this betänkande" }
        loften: { type: array, items: { $ref: "#/components/schemas/LoefteRef" } }
        debate:
          nullable: true
          description: "The chamber debate on the betänkande that decided the yrkande"
          allOf:
            - $ref: "#/components/schemas/Debate"
        punkt: { type: string, example: "6" }
        rubrik: { type: string, example: "Övriga frågor" }
        linkedBy: { type: string, enum: [behandlas_i_punkt, forslag_text], description: "How the yrkande was tied to the punkt" }
        beslutstyp: { type: string, description: "As Riksdagen gives it" }
        mode: { type: string, enum: [acklamation, votering, ej_beslutad, annat] }
        modeLabel: { type: string, description: "Avgjord utan omröstning for acklamation; Riksdagen's own word for an unknown beslutstyp" }
        alternativ: { type: string, description: "The alternative put to the vote, as Riksdagen words it; empty without a votering" }
        outcome: { type: string }
        voteringStored: { type: boolean, description: "True when the ballots of the votering are held" }
        voteringId: { type: string, description: "Riksdagen's votering id; empty without a votering" }
        voteringUrl: { type: string, description: "The votering at data.riksdagen.se; empty without a votering" }
        parties:
          type: array
          description: Partilinje of every party in the votering (shared definition); empty for acklamation
          items: { $ref: "#/components/schemas/PartyPartilinje" }
        reasoning: { type: string, description: "The utskott's own text (Utskottets ställningstagande) for the punkt, from the betänkande HTML; empty when not read" }
        reasoningAvailable: { type: boolean, description: "False when the reasoning could not be read; show it as not available from Riksdagen with a link to the source" }
        reservationsAvailable: { type: boolean, description: "False when the reservations could not be read, or the voted reservation is missing from what was read. True with an empty list means no reservation on the punkt" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/BetankandeStatement" }
        sarskildaYttranden:
          type: array
          items: { $ref: "#/components/schemas/BetankandeStatement" }
        votedReservation:
          nullable: true
          description: The reservation the votering put against the utskott's proposal, when the alternative names one. It can be another party's reservation than the motion's own party's.
          type: object
          required: [number, party, parties]
          properties:
            number: { type: integer, example: 12 }
            party: { type: string, description: "As in the alternative's wording, e.g. M in 'reservation 12 (M)'" }
            parties: { type: array, items: { type: string }, description: "Parties on the reservation as printed in the betänkande; empty if it could not be read" }

    BetankandePage:
      type: object
      required: [riksmote, beteckning, title, organ, dokId, sourceUrl, held, status, decided, decisionDate, decisionText, punkter, debate, loefteCount, loften]
      properties:
        riksmote: { type: string, example: "2025/26" }
        beteckning: { type: string, example: "SkU16" }
        title: { type: string }
        organ: { type: string }
        dokId: { type: string }
        loefteCount: { type: integer, description: "Berör N löften: public Löften with a Bekräftad koppling to a votering of this betänkande" }
        loften: { type: array, items: { $ref: "#/components/schemas/LoefteRef" } }
        sourceUrl: { type: string }
        held: { type: boolean, description: "False when the punkter come from the voteringar alone (betänkande not ingested)" }
        status: { type: string, description: "Riksdagen's status word, verbatim" }
        decided:
          type: boolean
          nullable: true
          description: "Riksdagen's decided state (beslutad / status / beslutsdag via Decided()); null when it could not be read. Never derived from our own timestamps."
        decisionDate: { type: string, description: "beslutsdag, YYYY-MM-DD; the planned date while decided is false" }
        decisionText: { type: string, description: "'Ej avgjort än' while decided is false; empty otherwise" }
        punkter:
          type: array
          items: { $ref: "#/components/schemas/BetankandePunkt" }
        debate:
          allOf:
            - $ref: "#/components/schemas/Debate"
          description: "The chamber debate on this betänkande: the anföranden linked to it. Empty (total 0) when none are linked."

    Debate:
      type: object
      description: >-
        The anföranden linked to a betänkande (by rel_dok_id, otherwise by
        avsnittsrubrik and protocol date; a speech neither matches stays
        unlinked), in speaking order. `total` can exceed the speeches listed.
      required: [date, total, speeches]
      properties:
        date: { type: string, nullable: true, description: "Date of the first linked speech, YYYY-MM-DD; null without speeches" }
        total: { type: integer }
        speeches:
          type: array
          items: { $ref: "#/components/schemas/DebateSpeech" }

    DebateSpeech:
      type: object
      required: [speechId, politicianId, name, party, date, excerpt, excerptAvailable, riksdagenUrl, linkRule]
      properties:
        speechId: { type: integer, description: "Our id; the full speech is at /anforanden/{speechId}" }
        politicianId: { type: string }
        name: { type: string }
        party: { type: string }
        date: { type: string, description: "Protocol date, YYYY-MM-DD" }
        excerpt: { type: string, description: "Start of the speech as plain text (at most 240 characters); empty while the text has not been fetched" }
        excerptAvailable: { type: boolean }
        riksdagenUrl: { type: string, description: "The speech on data.riksdagen.se" }
        linkRule:
          type: string
          enum: [rel_dok_id, avsnittsrubrik_datum]
          description: "The rule that tied the speech to the betänkande"

    BetankandePunkt:
      type: object
      required: [number, rubrik, text, beslutstyp, mode, modeLabel, alternativ, vinnare, voteringId, voteringStored, parties, avvikare, reasoning, reasoningAvailable, reservationsAvailable, reservations, sarskildaYttranden, votedReservation, motions]
      properties:
        number: { type: string }
        rubrik: { type: string }
        text: { type: string, description: "The utskott's proposal as plain text: Riksdagen's HTML entities are decoded (å, ä, ö), <br> is a line break (\\n) and other tags are dropped. Show it as text, never as HTML." }
        beslutstyp: { type: string }
        mode: { type: string, enum: [acklamation, votering, ej_beslutad, annat] }
        modeLabel: { type: string }
        alternativ: { type: string }
        vinnare: { type: string }
        voteringId: { type: string }
        voteringStored: { type: boolean }
        parties:
          type: array
          items: { $ref: "#/components/schemas/PartyPartilinje" }
        avvikare:
          type: array
          description: Members who voted against their Partilinje
          items:
            type: object
            required: [politicianId, name, party, voteResult, partilinje]
            properties:
              politicianId: { type: string }
              name: { type: string }
              party: { type: string }
              voteResult: { type: string }
              partilinje: { type: string }
        reasoning: { type: string }
        reasoningAvailable: { type: boolean }
        reservationsAvailable: { type: boolean }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/BetankandeStatement" }
        sarskildaYttranden:
          type: array
          items: { $ref: "#/components/schemas/BetankandeStatement" }
        votedReservation:
          nullable: true
          type: object
          required: [number, party, parties]
          properties:
            number: { type: integer }
            party: { type: string }
            parties: { type: array, items: { type: string } }
        motions:
          type: array
          description: Motions whose yrkanden this punkt decided
          items:
            type: object
            required: [dokId, riksmote, beteckning, title, subtyp, parties, yrkanden]
            properties:
              dokId: { type: string }
              riksmote: { type: string, example: "2017/18" }
              beteckning: { type: string, example: "3293" }
              title: { type: string }
              subtyp: { type: string }
              parties: { type: array, items: { type: string } }
              yrkanden: { type: array, items: { type: integer } }

    BetankandeStatement:
      type: object
      description: A reservation or särskilt yttrande, as the betänkande prints it
      required: [number, parties, signers, proposal, text]
      properties:
        number: { type: integer }
        parties: { type: array, items: { type: string } }
        signers: { type: array, items: { type: string }, description: "Names with party, as printed" }
        proposal: { type: string, description: "Förslag till riksdagsbeslut (reservations only)" }
        text: { type: string, description: "Ställningstagande, paragraphs separated by blank lines" }

    MotionListRow:
      type: object
      required: [dokId, riksmote, beteckning, title, subtyp, kind, parties, date, utskott, utskottName, handledIn, sourceUrl, outcome]
      properties:
        dokId: { type: string }
        riksmote: { type: string, example: "2017/18" }
        beteckning: { type: string, example: "3293" }
        title: { type: string }
        subtyp: { type: string, description: "Riksdagen's own value" }
        kind: { type: string, description: "Kommittémotion, Partimotion, Enskild motion or the derived Flerpartimotion" }
        parties: { type: array, items: { type: string }, description: "Distinct signer parties" }
        date: { type: [string, "null"], format: date }
        utskott: { type: string, description: "Utskott the motion is filed to" }
        utskottName: { type: string }
        handledIn:
          type: array
          items: { type: string, example: "2018/19:SkU11" }
          description: Betänkanden that decided its yrkanden
        sourceUrl: { type: string }
        outcome: { $ref: "#/components/schemas/MotionOutcome" }
    FrontPageResponse:
      type: object
      required: [decided, motions, upcoming, coverage, partyTiles]
      properties:
        decided: { type: array, items: { $ref: "#/components/schemas/BeslutListRow" } }
        motions: { type: array, items: { $ref: "#/components/schemas/FrontPageMotion" } }
        upcoming: { type: array, items: { $ref: "#/components/schemas/BeslutListRow" } }
        partyTiles:
          type: array
          description: >
            The eight parties in alphabetical order of party code, never by
            count. Counts come from Bekräftade kopplingar only.
          items: { $ref: "#/components/schemas/LoftePartySummary" }
        coverage:
          type: object
          required: [oldest, newest, stale]
          properties:
            oldest: { type: [string, "null"], format: date }
            newest: { type: [string, "null"], format: date }
            stale: { type: boolean, description: "The newest decision is older than the current week" }
    FrontPageMotion:
      allOf:
        - $ref: "#/components/schemas/MotionListRow"
        - type: object
          required: [decidedAt]
          properties:
            decidedAt: { type: string, format: date, description: "Date of the newest betänkande that decided one of its yrkanden" }
    BeslutListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/BeslutListRow" } }
        nextCursor: { type: [string, "null"] }
    BeslutListRow:
      type: object
      required: [riksmote, beteckning, title, utskott, utskottName, date, decided, status, outcome, sourceUrl, parties, loefteCount]
      properties:
        loefteCount: { type: integer, description: "Berör N löften: public Löften with a Bekräftad koppling to a votering of this betänkande" }
        riksmote: { type: string, example: "2026/27" }
        beteckning: { type: string, example: "SkU8" }
        title: { type: string }
        utskott: { type: string }
        utskottName: { type: string }
        date:
          type: [string, "null"]
          description: "Decision date when decided; the planned beslutsdag when upcoming; null when Riksdagen gives none"
        decided: { type: boolean }
        status: { type: string, description: "Riksdagen's own status word" }
        outcome:
          type: string
          description: "Ej avgjord än, or how the punkter were decided (with or without votering). It does not say which side won."
        sourceUrl: { type: string }
        parties:
          type: array
          description: "Empty for an upcoming row; otherwise the eight parties in a fixed order"
          items: { $ref: "#/components/schemas/BeslutPartyLine" }
    PartyRecord:
      type: object
      required: [party, decisions, motions]
      properties:
        party: { type: string }
        decisions: { type: array, items: { $ref: "#/components/schemas/PartyDecision" } }
        motions: { type: array, items: { $ref: "#/components/schemas/MotionListRow" } }
    PartyDecision:
      type: object
      required: [riksmote, beteckning, title, utskott, utskottName, date, decided, outcome, partilinje, voteringar, sourceUrl]
      properties:
        riksmote: { type: string, example: "2025/26" }
        beteckning: { type: string, example: "UbU30" }
        title: { type: string }
        utskott: { type: string }
        utskottName: { type: string }
        date: { type: [string, "null"] }
        decided: { type: boolean }
        outcome: { type: string }
        partilinje: { type: string, description: "Ja, Nej, Avstår, Delad, Varierar, or empty when no member of the party cast a ballot" }
        voteringar: { type: integer }
        sourceUrl: { type: string }
    BeslutPartyLine:
      type: object
      required: [party, partilinje, voteringar]
      properties:
        party: { type: string }
        partilinje:
          type: string
          description: "Ja, Nej, Avstår or Delad when every votering of the betänkande gives the same; Varierar when they differ; empty when no member cast a ballot"
        voteringar: { type: integer, description: "Voteringar of the betänkande in which the party cast a ballot" }
    MotionListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/MotionListRow" } }
        nextCursor: { type: [string, "null"] }
    MotionOutcome:
      type: object
      required: [word, counts, total]
      properties:
        word: { type: string, description: "Avslagen, Bifallen, Delvis bifallen, Besvarad, Blandat utfall or Ej avgjord än" }
        counts:
          type: object
          additionalProperties: { type: integer }
        total: { type: integer }

    Motion:
      type: object
      required: [dokId, riksmote, beteckning, title, subtyp, kind, kindExplanation, date, utskott, utskottName, status, behandlasI, sourceUrl, authors, yrkanden, outcome, loften]
      properties:
        loften:
          type: array
          description: Löften with a Bekräftad koppling to a votering of a betänkande that decided one of its yrkanden
          items: { $ref: "#/components/schemas/LoefteRef" }
        outcome: { $ref: "#/components/schemas/MotionOutcome" }
        dokId: { type: string, example: "H5023293" }
        riksmote: { type: string, example: "2017/18" }
        beteckning: { type: string, example: "3293" }
        title: { type: string }
        subtyp: { type: string, description: "Riksdagen's own subtyp, stored as given" }
        kind:
          type: string
          description: >-
            Kommittémotion, Partimotion, Enskild motion or Flerpartimotion
            (derived: an enskild motion whose signers span parties). An
            unknown subtyp is returned as Riksdagen gave it.
        kindExplanation: { type: string, description: "One line in the glossary's wording; empty for an unknown subtyp" }
        date: { type: [string, "null"], format: date }
        utskott: { type: string, example: "SkU" }
        utskottName: { type: string, example: "Skatteutskottet" }
        status: { type: string }
        behandlasI: { type: string, description: "Betänkande the motion is handled in, as given" }
        sourceUrl: { type: string, format: uri }
        authors:
          type: array
          items: { $ref: "#/components/schemas/MotionAuthor" }
        yrkanden:
          type: array
          items: { $ref: "#/components/schemas/MotionYrkande" }

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    IngestionFreshness:
      type: object
      required: [generatedAt, speeches, votes, jobs, alerts]
      properties:
        generatedAt:
          type: string
          format: date-time
        speeches:
          $ref: "#/components/schemas/FreshnessSeries"
        votes:
          $ref: "#/components/schemas/FreshnessSeries"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/IngestionJobFreshness"
        alerts:
          type: array
          description: >-
            Staleness conditions the daily chain logs at error. Empty when
            nothing has crossed a threshold. A summer recess can make the
            content alerts fire while Riksdagen is equally quiet; the external
            check compares these dates with Riksdagen before opening an issue.
          items:
            type: string

    FreshnessSeries:
      type: object
      required: [latestDate]
      properties:
        latestDate:
          type: string
          format: date
          nullable: true
          description: Newest record held, as a calendar date. Null when the table is empty.
        latestAt:
          type: string
          format: date-time
          nullable: true
          description: Present for votes, whose timestamp is system_datum. Absent for speeches, which are stored as a date.

    IngestionJobFreshness:
      type: object
      required: [name, schedule, lastSuccessAt, lastFinishedAt, lastStatus]
      properties:
        name:
          type: string
          example: fetch-speeches
        schedule:
          type: string
          enum: [daily, weekly]
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastFinishedAt:
          type: string
          format: date-time
          nullable: true
        lastStatus:
          type: string
          nullable: true
          enum: [success, error, running]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string

    Loefte:
      type: object
      required: [id, party, text, utskott, mandatePeriod, visibility, archived, createdAt]
      properties:
        id: { type: integer }
        party: { type: string }
        valmanifestId: { type: integer, nullable: true }
        text: { type: string }
        quote: { type: string }
        locator: { type: string }
        sourceUrl: { type: string }
        sourceDocument: { type: string }
        topic: { type: string }
        utskott: { type: array, items: { type: string } }
        mandatePeriod: { type: string, example: "2022-2026" }
        visibility: { type: string, enum: [approved, archived] }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }

    LoefteMedStatus:
      allOf:
        - $ref: "#/components/schemas/Loefte"
        - type: object
          required: [status, statusChangedAt]
          properties:
            status:
              type: string
              nullable: true
              enum: ["Röstat för", "Röstat emot", "Blandat", "Inte prövat än"]
              description: Löftesstatus. Null for archived Löften.
            statusChangedAt: { type: string, format: date-time, nullable: true, description: "When the confirmation that last changed the status was made; null if it never left Inte prövat än" }
            statusReason: { type: string, description: "Which koppling changed it, and from what" }
            kopplingar:
              type: array
              description: Only on GET /loften/{id}
              items:
                $ref: "#/components/schemas/BekraftadKoppling"

    BekraftadKoppling:
      type: object
      required: [id, loefteId, url, voteringId, beteckning, forslagspunkt, session, direction, ja, nej, avstar, franvarande, effect, explanation, confirmedAt]
      properties:
        id: { type: integer }
        loefteId: { type: integer }
        url: { type: string, description: Stable site path, example: /kopplingar/12 }
        voteringId: { type: string }
        beteckning: { type: string }
        forslagspunkt: { type: string }
        session: { type: string }
        betankande: { type: string }
        voteDate: { type: string }
        direction: { type: string, enum: [Ja, Nej], description: "The ballot a person confirmed to be in the Löfte's direction" }
        partilinje: { type: string, description: "The party's Partilinje; absent when no member cast a ballot" }
        ja: { type: integer }
        nej: { type: integer }
        avstar: { type: integer }
        franvarande: { type: integer, description: Shown, never counted }
        effect: { type: string, enum: [for, emot, ingen, utanfor] }
        explanation: { type: string, description: Plain explanation of why the vote counts as it does }
        confirmedAt: { type: string, format: date-time }

    LoefteRef:
      type: object
      description: A Löfte a decision touches. It implies nothing about the Löfte's status.
      required: [id, party, text]
      properties:
        id: { type: integer }
        party: { type: string }
        text: { type: string }
    LoftePartySummary:
      type: object
      required: [party, total, for, emot, blandat, inteProvat, arkiv]
      properties:
        party: { type: string }
        total: { type: integer }
        for: { type: integer }
        emot: { type: integer }
        blandat: { type: integer }
        inteProvat: { type: integer }
        arkiv: { type: integer }

    Valmanifest:
      type: object
      required: [id, party, electionYear, title, url, state]
      properties:
        id: { type: integer }
        party: { type: string }
        electionYear: { type: integer }
        title: { type: string }
        publishedOn: { type: string, format: date-time, nullable: true }
        url: { type: string }
        pdfUrl: { type: string }
        state: { type: string, enum: [draft, final], description: "The party's own marking" }

    PartyCode:
      type: string
      enum: [S, M, SD, C, V, KD, L, MP, unknown]
      description: Swedish party abbreviation

    Topic:
      type: string
      enum:
        - sjukvard
        - forsvar
        - invandring
        - skatt
        - skola
        - klimat
        - brott
        - bostad
        - arbete
        - energi
        - pension
        - other

    VoteResult:
      type: string
      enum: [Ja, Nej, Avstår, Frånvarande]

    ProposalType:
      type: string
      enum: [prop, mot, bet]
      description: "prop=government bill, mot=party motion, bet=committee report"

    Specificity:
      type: string
      enum: [concrete, directional, rhetorical]

    Politician:
      type: object
      required: [intressentId, firstName, lastName, party, isActive]
      properties:
        intressentId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        party:
          $ref: "#/components/schemas/PartyCode"
        constituency:
          type: string
        imageUrl:
          type: string
          format: uri
        isActive:
          type: boolean

    PoliticianSummary:
      allOf:
        - $ref: "#/components/schemas/Politician"
        - type: object
          properties:
            totalVotes:
              type: integer
            promiseCount:
              type: integer
            alignmentPct:
              type: number
              format: float
              description: Overall promise-to-vote alignment percentage

    PoliticianProfile:
      allOf:
        - $ref: "#/components/schemas/PoliticianSummary"
        - type: object
          properties:
            recentSpeeches:
              type: array
              items:
                $ref: "#/components/schemas/SpeechSummary"

    PoliticianListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PoliticianSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    SpeechSummary:
      type: object
      required: [id, date, topicHeading]
      properties:
        id:
          type: integer
        dokId:
          type: string
        date:
          type: string
          format: date
        topicHeading:
          type: string

    ProposalOrigin:
      type: object
      description: >-
        The title stored with the votering. Who proposed it is `proposedBy` on
        the vote detail and the decision feed, derived from the Motioner link;
        the single-party origin this object used to carry is retired.
      properties:
        documentTitle:
          type: string

    ProposingMotion:
      type: object
      description: One motion the förslagspunkt decided.
      required: [dokId, riksmote, beteckning, title, parties, yrkanden]
      properties:
        dokId:
          type: string
        riksmote:
          type: string
          example: "2021/22"
        beteckning:
          type: string
          example: "3638"
        title:
          type: string
        subtyp:
          type: string
          description: Riksdagen's subtyp, as given (Kommittémotion, Partimotion, ...).
        parties:
          type: array
          items:
            type: string
          description: Distinct parties of the motion's authors, in signing order.
        yrkanden:
          type: array
          items:
            type: integer
          description: The yrkande numbers of this motion the förslagspunkt decided.

    PropositionRef:
      type: object
      required: [riksmote, beteckning]
      properties:
        riksmote:
          type: string
        beteckning:
          type: string

    ProposedBy:
      type: object
      description: >-
        Who proposed what a votering decided, derived at read time from the
        förslagspunkt's links and keyed on riksmöte + beteckning +
        förslagspunkt: every motion and yrkande it decided, the propositions
        its text cites, and the alternative put to the vote (the reservation).
        Empty lists mean no link is held, not that nobody proposed it.
      required: [motions, propositions]
      properties:
        motions:
          type: array
          items:
            $ref: "#/components/schemas/ProposingMotion"
        propositions:
          type: array
          items:
            $ref: "#/components/schemas/PropositionRef"
        alternativ:
          type: string
          description: >-
            The alternative put to the vote, as Riksdagen words it ("Utskottets
            förslag mot reservation 12 (M)").

    Vote:
      type: object
      description: >-
        One member's vote on one förslagspunkt, returned exactly as the
        record holds it. Carries no decision date: the record holds only
        system_datum — when Riksdagen last touched the row — which is not
        the date the chamber decided.

        Identified by voteringId plus politicianId, which is the grain the
        ballots table is keyed on. There is no surrogate id: the previous one
        was a per-ballot SERIAL that no query filtered on and no consumer
        read, so it was removed with the denormalised table it belonged to.
      required:
        [
          voteringId,
          politicianId,
          party,
          voteResult,
          beteckning,
          forslagspunkt,
          session,
          proposalOrigin,
          createdAt,
        ]
      properties:
        voteringId:
          type: string
        politicianId:
          type: string
        party:
          type: string
          description: >-
            Party abbreviation, or "-" for a member sitting without party
            affiliation. Not a PartyCode — that enum has no "-" member.
        voteResult:
          $ref: "#/components/schemas/VoteResult"
        beteckning:
          type: string
          description: Committee report ID e.g. SoU12
        forslagspunkt:
          type: string
        session:
          type: string
          example: "2024/25"
        dokId:
          type: string
        proposalOrigin:
          $ref: "#/components/schemas/ProposalOrigin"
        createdAt:
          type: string
          format: date-time
          description: Our insert time. Not a decision date — see the schema note.
        avvikare:
          type: boolean
          description: >-
            Only on a member's own vote list. True when this ballot differs
            from the party's Ja or Nej Partilinje in the same votering (the
            shared Avvikare definition).
        partilinje:
          type: string
          description: The member's party's Partilinje in this votering (Ja, Nej, Avstår, Delad, Saknas).

    VoteListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    VoteDetail:
      type: object
      description: >-
        One förslagspunkt with each party's tally. Served from the record
        when the votering is stored, otherwise assembled live from
        Riksdagen — the live path returns an empty partyBreakdown and still
        carries proposedBy when the Motioner link is held.
        Everything under "Riksdagen dokumentstatus" below is present only
        when that document lookup succeeds.
      required:
        [
          beteckning,
          forslagspunkt,
          dokId,
          documentTitle,
          session,
          status,
          partyBreakdown,
          avvikare,
        ]
      properties:
        beteckning:
          type: string
        forslagspunkt:
          type: string
        dokId:
          type: string
        documentTitle:
          type: string
        proposedBy:
          $ref: "#/components/schemas/ProposedBy"
        avvikare:
          type: array
          description: >-
            Members who voted against their party's Ja or Nej Partilinje, worked
            out per votering (a förslagspunkt decided by two voteringar never
            blends their ballots). Empty on the live-from-Riksdagen path.
          items:
            $ref: "#/components/schemas/Avvikare"
        session:
          type: string
        partyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PartyVotePosition"
        status:
          type: string
          description: >-
            Outcome of this förslagspunkt from the ballot tally: "Bifall" when
            Ja outnumbers Nej, "Avslag" when Nej outnumbers Ja. Empty when the
            tally is a tie or contains neither Ja nor Nej — that is not
            reported as Bifall. Not Återremiss; the page reads that from
            statusText when Riksdagen published it. Scoped to the requested
            punkt, not to the whole betänkande.
        # ── Riksdagen dokumentstatus — present only when that lookup succeeds ──
        date:
          type: string
          description: "Decision date from Riksdagen, YYYY-MM-DD"
        subtitle:
          type: string
        summary:
          type: string
          description: "Plain-text summary of the betänkande"
        bodyHtml:
          type: string
          description: >-
            Full Riksdagen document body (HTML), rendered inline on the
            beslut detail page.
        debattDate:
          type: string
          description: >-
            Raw dokuppgift debattdatumtid, "YYYY-MM-DD HH:MM:SS". Shown
            verbatim.
        beslutDate:
          type: string
          description: >-
            Raw dokuppgift beslutdatumtid, "YYYY-MM-DD HH:MM:SS". Shown
            verbatim.
        statusText:
          type: string
          description: Raw dokuppgift statustext.
        notis:
          type: string
          description: >-
            "Beslut i korthet" — Riksdagen's plain-Swedish summary, raw HTML.

    VoteSummary:
      type: object
      required: [riksmote, beteckning, forslagspunkt, documentTitle, proposedBy]
      properties:
        riksmote:
          type: string
          example: "2021/22"
        beteckning:
          type: string
        forslagspunkt:
          type: string
        documentTitle:
          type: string
        proposedBy:
          $ref: "#/components/schemas/ProposedBy"
    VoteSummaryListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VoteSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PartyVotePosition:
      type: object
      required: [party, jaCount, nejCount, avstarCount, franvarandeCount]
      properties:
        party:
          $ref: "#/components/schemas/PartyCode"
        jaCount:
          type: integer
        nejCount:
          type: integer
        avstarCount:
          type: integer
        franvarandeCount:
          type: integer
        partilinje:
          $ref: "#/components/schemas/Partilinje"
    Partilinje:
      type: string
      enum: [Ja, Nej, Avstår, Delad]
      description: >-
        A party's position in a votering: the strict plurality of its cast
        ballots (Ja, Nej, Avstår). Frånvarande is not a cast ballot and is
        excluded. "Delad" when two or more positions share the top count.
        The field is absent when no member of the party cast a ballot, and
        for the record's "-" no-party placeholder. One definition shared by
        every endpoint that reports a party position.

    Avvikare:
      type: object
      required: [voteringId, politicianId, party, voteResult, partilinje]
      description: >-
        A member whose cast ballot (Ja, Nej or Avstår) differs from their
        party's Ja or Nej Partilinje in one votering. Frånvarande is never an
        Avvikare, and a party whose Partilinje is Avstår or Delad has none.
      properties:
        voteringId:
          type: string
        politicianId:
          type: string
        party:
          type: string
        voteResult:
          $ref: "#/components/schemas/VoteResult"
        partilinje:
          $ref: "#/components/schemas/Partilinje"

    PartyPosition:
      type: object
      required: [party]
      description: >-
        A party's Partilinje in one votering — the same definition as
        PartyVotePosition.partilinje. Stated as fact, never scored against a
        promise. Never carries the record's "-" placeholder for ballots with no
        party affiliation: this is a per-party list, and "-" is not a party.
      properties:
        party:
          $ref: "#/components/schemas/PartyCode"
        position:
          $ref: "#/components/schemas/Partilinje"

    CommitteeVotering:
      type: object
      required:
        [voteringId, beteckning, forslagspunkt, documentTitle, riksmote,
         decidedByMultipleVoteringar, partyPositions]
      description: >-
        One decided förslagspunkt with every party's position. Carries no
        date: votes hold only system_datum, which is when Riksdagen last
        touched the record, so presenting it as a decision date would repeat
        a bug the site already removed.
      properties:
        voteringId:
          type: string
          description: >-
            Distinguishes the 18 förslagspunkter in 2022-2026 that were
            genuinely decided by two separate voteringar — same beteckning
            and förslagspunkt, different votering, possibly contradictory
            party positions.
        beteckning:
          type: string
        forslagspunkt:
          type: string
        documentTitle:
          type: string
        riksmote:
          type: string
          example: "2024/25"
        decidedByMultipleVoteringar:
          type: boolean
          description: >-
            True when the record holds more than one votering for this
            (riksmöte, beteckning, förslagspunkt). Such a pair renders as two
            rows that are identical apart from their party positions, which can
            be opposite — without this flag they read as parties reversing
            themselves on one question for no reason.

            Computed server-side over the committee's whole record before
            paging, because a caller sees one page at a time and a pair can
            straddle a page boundary: NU7 punkt 2 in 2025/26 sits at indices
            149 and 150, so a client counting duplicates within its own page
            marks neither half.
        partyPositions:
          type: array
          items: { $ref: "#/components/schemas/PartyPosition" }

    CommitteeVoteringPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommitteeVotering" }
        total:
          type: integer
          description: Total voteringar for this committee, independent of paging

    RecordCoverage:
      type: object
      required: [mandate, expected, ingested, unreachable, byRiksmote]
      properties:
        mandate:
          $ref: "#/components/schemas/MandatePeriod"
        expected:
          type: integer
          description: Riksdagen's count of voteringar in the mandate period.
        ingested:
          type: integer
          description: How many of those the site holds.
        unreachable:
          type: integer
          description: >-
            Voteringar Riksdagen lists that carry no beteckning and therefore
            cannot be fetched. Reported so a shortfall is explained rather than
            left as an unexplained gap.
        lastDecisionDate:
          type: string
          nullable: true
          description: Date of the newest decision held. Not an ingest timestamp.
        denominatorCheckedAt:
          type: string
          nullable: true
          description: >-
            When `expected` was last read from Riksdagen — the oldest such date
            across the period's riksmöten, since the figure is only as fresh as
            its stalest part. `ingested` is counted live and always current;
            `expected`, `unreachable` and `lastDecisionDate` come from a
            separate enumeration pass, so their age is stated rather than
            implied. Null means the denominator has never been established.
        byRiksmote:
          type: array
          items:
            $ref: "#/components/schemas/RiksmoteRecord"

