openapi: "3.1.0"
info:
  title: Riksdagskollen API
  description: Tracks Swedish politicians' stated promises and party goals against their actual voting records in Riksdagen.
  version: "1.0.0"
  contact:
    name: Riksdagskollen

servers:
  - url: /api
    description: API base path

tags:
  - name: health
    description: Health checks
  - name: parties
    description: Party goals and scorecards
  - name: politicians
    description: Individual politician profiles and voting records
  - name: votes
    description: Vote details with proposal origin context
  - name: budget
    description: National budget (statsbudgeten) tracking and comparison
  - name: context
    description: Topic-level budget context for voters
  - name: regions
    description: Swedish regional (läns) election results and governing coalitions
  - name: municipalities
    description: Swedish municipal (kommunal) election results and governing coalitions
  - name: riksdag
    description: National level — state agency expenditure data

paths:
  /riksdag/authorities:
    get:
      operationId: getRiksdagAuthorities
      tags: [riksdag]
      summary: State agencies with actual annual expenditure (driftkostnader)
      responses:
        "200":
          description: List of state agencies sorted by expenditure descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiksdagAuthority"
        "502":
          description: Upstream data source unavailable

  /riksdag/authorities/{slug}:
    get:
      operationId: getRiksdagAuthority
      tags: [riksdag]
      summary: Single state agency detail including regleringsbrev link
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: polismyndigheten
      responses:
        "200":
          description: Agency detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiksdagAuthorityDetail"
        "404":
          description: Agency not found
        "502":
          description: Upstream data source unavailable

  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /parties:
    get:
      operationId: listParties
      tags: [parties]
      summary: List all parties with summary scorecard data
      responses:
        "200":
          description: List of parties with aggregate alignment scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartySummary"

  /parties/{party}/goals:
    get:
      operationId: listPartyGoals
      tags: [parties]
      summary: List all goals for a party with alignment percentages
      parameters:
        - $ref: "#/components/parameters/PartyParam"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/Topic"
      responses:
        "200":
          description: Party goals with vote alignment data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalWithAlignment"
        "404":
          $ref: "#/components/responses/NotFound"

  /parties/{party}/goals/{goalId}/votes:
    get:
      operationId: listGoalVotes
      tags: [parties]
      summary: Detailed vote breakdown for a specific party goal
      parameters:
        - $ref: "#/components/parameters/PartyParam"
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Votes relevant to this goal with context notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalVoteBreakdown"
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians:
    get:
      operationId: listPoliticians
      tags: [politicians]
      summary: List politicians with summary statistics
      parameters:
        - name: party
          in: query
          schema:
            $ref: "#/components/schemas/PartyCode"
        - name: active
          in: query
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list of politicians
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliticianListResponse"

  /politicians/{id}:
    get:
      operationId: getPolitician
      tags: [politicians]
      summary: Full politician profile
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
      responses:
        "200":
          description: Politician profile with statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliticianProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians/{id}/promises:
    get:
      operationId: listPoliticianPromises
      tags: [politicians]
      summary: Promises extracted from speeches with vote match results
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/Topic"
      responses:
        "200":
          description: Promises with vote alignment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromiseWithMatches"
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians/{id}/votes:
    get:
      operationId: listPoliticianVotes
      tags: [politicians]
      summary: Voting record with proposal origin context
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
        - name: session
          in: query
          schema:
            type: string
            example: "2024/25"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/Topic"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Voting record with proposal origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /votes/riksdag-feed:
    get:
      operationId: getRiksdagFeed
      tags: [votes]
      summary: Recent Riksdag betänkanden relevant to a given governance level
      parameters:
        - name: level
          in: query
          required: true
          schema:
            type: string
            enum: [region, kommun]
      responses:
        "200":
          description: Recent betänkanden with beteckning for deep-linking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiksdagFeedItem"

  /votes/{beteckning}/{punkt}:
    get:
      operationId: getVoteDetail
      tags: [votes]
      summary: Full vote detail with proposal origin and all party positions
      parameters:
        - name: beteckning
          in: path
          required: true
          schema:
            type: string
            example: "SoU12"
        - name: punkt
          in: path
          required: true
          schema:
            type: string
            example: "1"
      responses:
        "200":
          description: Full vote detail with party breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/years:
    get:
      operationId: listBudgetYears
      tags: [budget]
      summary: List all available budget years with totals
      responses:
        "200":
          description: Budget years with total amounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetYear"

  /budget/years/{year}:
    get:
      operationId: getBudgetYear
      tags: [budget]
      summary: Full budget breakdown for a specific year
      parameters:
        - $ref: "#/components/parameters/BudgetYearParam"
      responses:
        "200":
          description: Budget year with all expenditure area allocations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetYearDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/years/{year}/compare/{compareYear}:
    get:
      operationId: compareBudgetYears
      tags: [budget]
      summary: Side-by-side comparison of two budget years with deltas
      parameters:
        - $ref: "#/components/parameters/BudgetYearParam"
        - name: compareYear
          in: path
          required: true
          schema:
            type: integer
            example: 2024
      responses:
        "200":
          description: Comparison with delta amounts and percentages per area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetComparison"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/areas:
    get:
      operationId: listExpenditureAreas
      tags: [budget]
      summary: List all 27 expenditure areas
      responses:
        "200":
          description: Expenditure areas ordered by sort_order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenditureArea"

  /context/topic/{topic}:
    get:
      operationId: getTopicContext
      tags: [context]
      summary: Budget and economic context for a political topic
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Topic"
      responses:
        "200":
          description: Topic context with budget trend and funding analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicContext"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/areas/{code}:
    get:
      operationId: getAreaTimeSeries
      tags: [budget]
      summary: Time series of budget amounts for one expenditure area
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "UO6"
      responses:
        "200":
          description: Yearly amounts for the expenditure area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaTimeSeries"
        "404":
          $ref: "#/components/responses/NotFound"

  /regions:
    get:
      operationId: listRegions
      tags: [regions]
      summary: List all 21 Swedish regions with election results and governing parties
      responses:
        "200":
          description: All regions with 2022 election summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionSummary"

  /regions/{code}:
    get:
      operationId: getRegion
      tags: [regions]
      summary: Full region detail including election results per party
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "01"
            description: Two-digit region code (SCB/Valmyndigheten)
      responses:
        "200":
          description: Region with full election result breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /regions/{code}/budget:
    get:
      operationId: getRegionBudget
      tags: [regions]
      summary: Real budget breakdown for a region from SCB (nettokostnader by verksamhetsområde)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "06"
            description: Two-digit region code
      responses:
        "200":
          description: Budget areas with value in mnkr and percentage of total
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionBudgetArea"
        "502":
          description: Upstream SCB API error

  /municipalities:
    get:
      operationId: listMunicipalities
      tags: [municipalities]
      summary: List Swedish municipalities, optionally filtered by region
      parameters:
        - name: regionCode
          in: query
          schema:
            type: string
            example: "01"
            description: Filter by two-digit region code
      responses:
        "200":
          description: Municipalities with election summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalitySummary"

  /municipalities/{code}:
    get:
      operationId: getMunicipality
      tags: [municipalities]
      summary: Full municipality detail including election results per party
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "0180"
            description: Four-digit municipality code (SCB/Valmyndigheten)
      responses:
        "200":
          description: Municipality with full election result breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MunicipalityDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /municipalities/{code}/kpi:
    get:
      operationId: getMunicipalityKPIs
      tags: [municipalities]
      summary: Kolada KPI spending metrics for a municipality
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "0180"
      responses:
        "200":
          description: Array of KPI values (up to 2 years per indicator)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalityKPIItem"
        "502":
          description: Upstream Kolada API error

  /municipalities/{code}/spending:
    get:
      operationId: getMunicipalitySpending
      tags: [municipalities]
      summary: Sector spending breakdown from Kolada (2019–2023)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "0180"
      responses:
        "200":
          description: Array of spending KPI values (8 sectors × up to 5 years)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalityKPIItem"
        "502":
          description: Upstream Kolada API error

  /municipalities/{code}/procurement:
    get:
      operationId: getMunicipalityProcurement
      tags: [municipalities]
      summary: Public procurement breakdown by CPV category from TED (2021–2024)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "1480"
      responses:
        "200":
          description: Top CPV procurement categories by contracted value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementCategorySummary"
        "502":
          description: Upstream TED API error

  /municipalities/{code}/population-trend:
    get:
      operationId: getMunicipalityPopulationTrend
      tags: [municipalities]
      summary: SCB population trend for a municipality (2019–2023)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "0180"
      responses:
        "200":
          description: Year-by-year population entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopulationTrendEntry"
        "502":
          description: Upstream SCB API error

components:
  parameters:
    PartyParam:
      name: party
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PartyCode"
    PoliticianIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: Riksdagen intressent_id
    BudgetYearParam:
      name: year
      in: path
      required: true
      schema:
        type: integer
        example: 2025

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string

    PartyCode:
      type: string
      enum: [S, M, SD, C, V, KD, L, MP, unknown]
      description: Swedish party abbreviation

    Topic:
      type: string
      enum:
        - sjukvard
        - forsvar
        - invandring
        - skatt
        - skola
        - klimat
        - brott
        - bostad
        - arbete
        - energi
        - other

    VoteResult:
      type: string
      enum: [Ja, Nej, Avstår, Frånvarande]

    ProposalType:
      type: string
      enum: [prop, mot, bet]
      description: "prop=government bill, mot=party motion, bet=committee report"

    Specificity:
      type: string
      enum: [concrete, directional, rhetorical]

    Politician:
      type: object
      required: [intressentId, firstName, lastName, party, isActive]
      properties:
        intressentId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        party:
          $ref: "#/components/schemas/PartyCode"
        constituency:
          type: string
        imageUrl:
          type: string
          format: uri
        isActive:
          type: boolean

    PoliticianSummary:
      allOf:
        - $ref: "#/components/schemas/Politician"
        - type: object
          properties:
            totalVotes:
              type: integer
            promiseCount:
              type: integer
            alignmentPct:
              type: number
              format: float
              description: Overall promise-to-vote alignment percentage

    PoliticianProfile:
      allOf:
        - $ref: "#/components/schemas/PoliticianSummary"
        - type: object
          properties:
            recentSpeeches:
              type: array
              items:
                $ref: "#/components/schemas/SpeechSummary"

    PoliticianListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PoliticianSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    SpeechSummary:
      type: object
      required: [id, date, topicHeading]
      properties:
        id:
          type: integer
        dokId:
          type: string
        date:
          type: string
          format: date
        topicHeading:
          type: string

    Vote:
      type: object
      required: [id, voteringId, politicianId, party, voteResult, beteckning, forslagspunkt, session]
      properties:
        id:
          type: integer
        voteringId:
          type: string
        politicianId:
          type: string
        party:
          $ref: "#/components/schemas/PartyCode"
        voteResult:
          $ref: "#/components/schemas/VoteResult"
        beteckning:
          type: string
          description: Committee report ID e.g. SoU12
        forslagspunkt:
          type: string
        session:
          type: string
          example: "2024/25"
        dokId:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"
        documentTitle:
          type: string
        createdAt:
          type: string
          format: date-time

    VoteListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    VoteDetail:
      type: object
      required: [beteckning, forslagspunkt, documentTitle, partyBreakdown]
      properties:
        beteckning:
          type: string
        forslagspunkt:
          type: string
        dokId:
          type: string
        documentTitle:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"
        session:
          type: string
        partyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PartyVotePosition"
        contextNote:
          type: string
          description: AI-generated explanation of political context
        date:
          type: string
          description: "Decision date from Riksdagen, YYYY-MM-DD"
        status:
          type: string
          description: "Authoritative outcome: Bifall | Avslag | Återremiss"
        subtitle:
          type: string
        summary:
          type: string
          description: "Plain-text summary of the betänkande"

    PartyVotePosition:
      type: object
      required: [party, jaCount, nejCount, avstarCount, franvarandeCount]
      properties:
        party:
          $ref: "#/components/schemas/PartyCode"
        jaCount:
          type: integer
        nejCount:
          type: integer
        avstarCount:
          type: integer
        franvarandeCount:
          type: integer
        dominantVote:
          $ref: "#/components/schemas/VoteResult"

    Goal:
      type: object
      required: [id, party, goalText, topic, specificity, sourceDocument]
      properties:
        id:
          type: integer
        party:
          $ref: "#/components/schemas/PartyCode"
        goalText:
          type: string
        topic:
          $ref: "#/components/schemas/Topic"
        specificity:
          $ref: "#/components/schemas/Specificity"
        sourceDocument:
          type: string
          example: "Valmanifest 2022"
        keywords:
          type: array
          items:
            type: string
        relevantCommittees:
          type: array
          items:
            type: string

    GoalWithAlignment:
      allOf:
        - $ref: "#/components/schemas/Goal"
        - type: object
          properties:
            relevantVotes:
              type: integer
            alignmentPct:
              type: number
              format: float
              description: Percentage of relevant votes aligned with goal direction

    GoalVoteBreakdown:
      type: object
      required: [goal, matches]
      properties:
        goal:
          $ref: "#/components/schemas/GoalWithAlignment"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GoalVoteMatch"

    GoalVoteMatch:
      type: object
      required: [beteckning, forslagspunkt, relevanceScore, alignedDirection]
      properties:
        beteckning:
          type: string
        forslagspunkt:
          type: string
        relevanceScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
        alignedDirection:
          $ref: "#/components/schemas/VoteResult"
        explanation:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"
        contextNote:
          type: string
        documentTitle:
          type: string
        partyAlignmentPct:
          type: number
          format: float
          description: What % of party members voted in the aligned direction

    PartySummary:
      type: object
      required: [party, totalGoals, avgAlignmentPct]
      properties:
        party:
          $ref: "#/components/schemas/PartyCode"
        totalGoals:
          type: integer
        avgAlignmentPct:
          type: number
          format: float
        topicBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/TopicAlignment"

    TopicAlignment:
      type: object
      required: [topic, goalCount, alignmentPct]
      properties:
        topic:
          $ref: "#/components/schemas/Topic"
        goalCount:
          type: integer
        alignmentPct:
          type: number
          format: float

    Promise:
      type: object
      required: [id, politicianId, promiseText, topic, specificity]
      properties:
        id:
          type: integer
        politicianId:
          type: string
        speechId:
          type: integer
        speechDate:
          type: string
          format: date
        speechTopic:
          type: string
        promiseText:
          type: string
        topic:
          $ref: "#/components/schemas/Topic"
        specificity:
          $ref: "#/components/schemas/Specificity"
        keywords:
          type: array
          items:
            type: string

    PromiseWithMatches:
      allOf:
        - $ref: "#/components/schemas/Promise"
        - type: object
          properties:
            voteMatches:
              type: array
              items:
                $ref: "#/components/schemas/PromiseVoteMatch"

    PromiseVoteMatch:
      type: object
      required: [voteId, relevanceScore, alignment]
      properties:
        voteId:
          type: integer
        beteckning:
          type: string
        forslagspunkt:
          type: string
        documentTitle:
          type: string
        voteResult:
          $ref: "#/components/schemas/VoteResult"
        relevanceScore:
          type: number
          format: float
        alignment:
          type: string
          enum: [supports, contradicts, unclear]
        explanation:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"

    ExpenditureArea:
      type: object
      required: [code, name, sortOrder]
      properties:
        code:
          type: string
          example: "UO6"
        name:
          type: string
          example: "Försvar och samhällets krisberedskap"
        description:
          type: string
        sortOrder:
          type: integer

    BudgetYear:
      type: object
      required: [year, status, totalKsek]
      properties:
        year:
          type: integer
          example: 2025
        status:
          type: string
          enum: [decided, proposed]
        totalKsek:
          type: integer
          format: int64
          description: Total budget in thousands of kronor

    BudgetAllocation:
      type: object
      required: [area, amountKsek]
      properties:
        area:
          $ref: "#/components/schemas/ExpenditureArea"
        amountKsek:
          type: integer
          format: int64
        amountFormatted:
          type: string
          description: "Human-readable amount, e.g. '145,2 mdkr'"

    BudgetDocumentRef:
      type: object
      required: [type, title, url, description]
      properties:
        type:
          type: string
          enum: [proposition, committee_report]
          description: Document type
        title:
          type: string
          example: "Prop. 2024/25:1"
        url:
          type: string
          format: uri
          description: Link to the document on riksdagen.se
        description:
          type: string
          example: "Budgetpropositionen för 2025"

    BudgetYearDetail:
      type: object
      required: [year, status, totalKsek, allocations]
      properties:
        year:
          type: integer
        status:
          type: string
          enum: [decided, proposed]
        totalKsek:
          type: integer
          format: int64
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/BudgetAllocation"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BudgetDocumentRef"
          description: Links to relevant budget proposition and committee reports

    BudgetComparisonRow:
      type: object
      required: [area, baseAmountKsek, compareAmountKsek, deltaKsek, deltaPct]
      properties:
        area:
          $ref: "#/components/schemas/ExpenditureArea"
        baseAmountKsek:
          type: integer
          format: int64
        compareAmountKsek:
          type: integer
          format: int64
        deltaKsek:
          type: integer
          format: int64
          description: compareAmount - baseAmount
        deltaPct:
          type: number
          format: float
          description: Percentage change from base to compare year

    BudgetComparison:
      type: object
      required: [baseYear, compareYear, rows, baseTotalKsek, compareTotalKsek]
      properties:
        baseYear:
          type: integer
        compareYear:
          type: integer
        baseTotalKsek:
          type: integer
          format: int64
        compareTotalKsek:
          type: integer
          format: int64
        totalDeltaKsek:
          type: integer
          format: int64
        totalDeltaPct:
          type: number
          format: float
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BudgetComparisonRow"

    AreaTimeSeries:
      type: object
      required: [area, entries]
      properties:
        area:
          $ref: "#/components/schemas/ExpenditureArea"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AreaTimeSeriesEntry"

    AreaTimeSeriesEntry:
      type: object
      required: [year, amountKsek]
      properties:
        year:
          type: integer
        amountKsek:
          type: integer
          format: int64
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BudgetDocumentRef"
          description: Links to the area-specific budget proposition volume

    BudgetTrendEntry:
      type: object
      required: [year, amountKsek, amountFormatted]
      properties:
        year:
          type: integer
        amountKsek:
          type: integer
          format: int64
        amountFormatted:
          type: string
          description: "Human-readable amount, e.g. '87,3 mdkr'"

    RelatedBudgetArea:
      type: object
      required: [code, name, trend, latestDeltaPct, shareOfBudgetPct]
      properties:
        code:
          type: string
          example: "UO9"
        name:
          type: string
        trend:
          type: array
          items:
            $ref: "#/components/schemas/BudgetTrendEntry"
        latestDeltaPct:
          type: number
          format: float
          description: Year-over-year change in percent
        shareOfBudgetPct:
          type: number
          format: float
          description: Area's share of total national budget in the latest year

    FundingRow:
      type: object
      required: [code, name, deltaKsek, deltaPct]
      properties:
        code:
          type: string
        name:
          type: string
        deltaKsek:
          type: integer
          format: int64
        deltaPct:
          type: number
          format: float

    FundingContext:
      type: object
      required: [year, topIncreases, topDecreases]
      properties:
        year:
          type: integer
        topIncreases:
          type: array
          items:
            $ref: "#/components/schemas/FundingRow"
        topDecreases:
          type: array
          items:
            $ref: "#/components/schemas/FundingRow"
        totalBudgetDeltaKsek:
          type: integer
          format: int64
        totalBudgetDeltaPct:
          type: number
          format: float

    TopicContext:
      type: object
      required: [topic, description, committees, relatedAreas]
      properties:
        topic:
          $ref: "#/components/schemas/Topic"
        description:
          type: string
        committees:
          type: array
          items:
            type: string
        relatedAreas:
          type: array
          items:
            $ref: "#/components/schemas/RelatedBudgetArea"
        fundingContext:
          $ref: "#/components/schemas/FundingContext"

    ElectionResult:
      type: object
      required: [party, mandates, votePct, totalMandates]
      properties:
        party:
          type: string
          description: Party abbreviation (e.g. S, M, SD) or "OTHER" for small parties
        mandates:
          type: integer
          description: Number of seats won
        votePct:
          type: number
          format: float
          description: Share of votes in percent
        totalMandates:
          type: integer
          description: Total seats in the assembly

    RegionSummary:
      type: object
      required: [code, name, capital, population, electionYear, governingParties, totalMandates]
      properties:
        code:
          type: string
          example: "01"
          description: Two-digit SCB region code
        name:
          type: string
          example: "Region Stockholm"
        capital:
          type: string
          example: "Stockholm"
        population:
          type: integer
          example: 2400000
        electionYear:
          type: integer
          example: 2022
        governingParties:
          type: array
          items:
            type: string
          description: Parties in the governing coalition
        totalMandates:
          type: integer
          description: Total seats in regionfullmäktige

    RegionDetail:
      allOf:
        - $ref: "#/components/schemas/RegionSummary"
        - type: object
          required: [electionResults]
          properties:
            electionResults:
              type: array
              items:
                $ref: "#/components/schemas/ElectionResult"

    RiksdagFeedItem:
      type: object
      required: [time, title, status]
      properties:
        time:
          type: string
          example: "2025-04-15"
        title:
          type: string
          example: "Betänkande om sjukvårdsreform"
        status:
          type: string
          example: "Bifall"
        tag:
          type: string
          example: "Vård"
        beteckning:
          type: string
          example: "SoU2425:12"

    RegionBudgetArea:
      type: object
      required: [name, value, pct]
      properties:
        name:
          type: string
          example: "Primärvård"
        value:
          type: number
          format: float
          description: Net cost in mnkr (miljoner kronor)
          example: 2654
        pct:
          type: number
          format: float
          description: Share of total regional nettokostnad
          example: 18.9

    MunicipalitySummary:
      type: object
      required: [code, name, regionCode, regionName, population, electionYear, governingParties, totalMandates]
      properties:
        code:
          type: string
          example: "0180"
          description: Four-digit SCB municipality code
        name:
          type: string
          example: "Stockholms kommun"
        regionCode:
          type: string
          example: "01"
        regionName:
          type: string
          example: "Region Stockholm"
        population:
          type: integer
          example: 980000
        electionYear:
          type: integer
          example: 2022
        governingParties:
          type: array
          items:
            type: string
          description: Parties in the governing coalition
        totalMandates:
          type: integer
          description: Total seats in kommunfullmäktige

    MunicipalityDetail:
      allOf:
        - $ref: "#/components/schemas/MunicipalitySummary"
        - type: object
          required: [electionResults]
          properties:
            electionResults:
              type: array
              items:
                $ref: "#/components/schemas/ElectionResult"

    MunicipalityKPIItem:
      type: object
      required: [kpi, year, value, status]
      properties:
        kpi:
          type: string
          example: "N00902"
          description: Kolada KPI code
        year:
          type: integer
          example: 2023
        value:
          type: number
          format: float
          example: 85432.0
        status:
          type: string
          example: ""
          description: Empty string means normal; "M" means missing data

    PopulationTrendEntry:
      type: object
      required: [year, population]
      properties:
        year:
          type: integer
          example: 2023
        population:
          type: integer
          example: 978770

    ProcurementCategorySummary:
      type: object
      required: [cpv_division, label, total_value_sek, pct, count]
      properties:
        cpv_division:
          type: string
          example: "45"
          description: First two digits of the CPV code (main division)
        label:
          type: string
          example: "Bygg & anläggning"
          description: Swedish label for the CPV division
        total_value_sek:
          type: number
          format: float
          example: 1105500000
          description: Total contracted value in SEK for this category
        pct:
          type: number
          format: float
          example: 27.1
          description: Percentage of total procurement spend
        count:
          type: integer
          example: 12
          description: Number of contract award notices in this category

    YearlyExpenditure:
      type: object
      required: [year, expenditureMdkr]
      properties:
        year:
          type: integer
          example: 2024
        expenditureMdkr:
          type: number
          format: float
          example: 41.4

    RiksdagAuthority:
      type: object
      required: [slug, name, role, ministry, headcount, headcountInt, expenditureMdkr, year]
      properties:
        slug:
          type: string
          example: polismyndigheten
        name:
          type: string
          example: Polismyndigheten
        role:
          type: string
          example: Ordning & utredning
        ministry:
          type: string
          example: Justitiedepartementet
        headcount:
          type: string
          example: "35 500"
        headcountInt:
          type: integer
          example: 35500
        description:
          type: string
          example: Sveriges största myndighet, ansvarar för brottsbekämpning, utredning och ordningshållning.
        websiteUrl:
          type: string
          format: uri
          example: https://polisen.se
        annualReportUrl:
          type: string
          format: uri
          example: https://polisen.se/om-polisen/organisation/arsredovisning/
        expenditureMdkr:
          type: number
          format: float
          example: 41.4
          description: Actual annual driftkostnad in mdkr (excl. transfer payments)
        year:
          type: integer
          example: 2024
        history:
          type: array
          items:
            $ref: "#/components/schemas/YearlyExpenditure"

    AgencyRegleringsbrev:
      type: object
      required: [year, date, title, summary, url]
      properties:
        year:
          type: integer
          example: 2024
        date:
          type: string
          format: date
          example: "2024-12-19"
        title:
          type: string
          example: "Regleringsbrev för budgetåret 2024 avseende Polismyndigheten"
        summary:
          type: string
          example: "Polismyndigheten ska verka för att minska brottsligheten och öka tryggheten."
        url:
          type: string
          format: uri
          example: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/Rb12345/

    AgencyDecision:
      type: object
      required: [date, title, docType, summary, url]
      properties:
        date:
          type: string
          format: date
          example: "2024-11-20"
        title:
          type: string
          example: "Riksdagens kontrollmakt och Riksrevisionen"
        docType:
          type: string
          example: bet
        summary:
          type: string
        url:
          type: string
          format: uri

    RiksdagAuthorityDetail:
      allOf:
        - $ref: "#/components/schemas/RiksdagAuthority"
        - type: object
          required: [mandate, regleringsbrev, recentDecisions]
          properties:
            mandate:
              type: string
              example: "Inrättades 2015 per polislagen. Nationell civil myndighet med ansvar för brottsförebyggande arbete, utredning och ordningshållning."
            mandateUrl:
              type: string
              format: uri
              example: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/polislag-1984387_sfs-1984-387/"
            regleringsbrev:
              type: array
              items:
                $ref: "#/components/schemas/AgencyRegleringsbrev"
            recentDecisions:
              type: array
              items:
                $ref: "#/components/schemas/AgencyDecision"
