        year:
          type: integer
          example: 2024
        date:
          type: string
          format: date
          example: "2024-12-19"
        title:
          type: string
          example: "Regleringsbrev för budgetåret 2024 avseende Polismyndigheten"
        summary:
          type: string
          example: "Polismyndigheten ska verka för att minska brottsligheten och öka tryggheten."
        url:
          type: string
          format: uri
          example: https://www.riksdagen.se/sv/dokument-och-lagar/dokument/Rb12345/

    AgencyDecision:
      type: object
      required: [date, title, docType, summary, url]
      properties:
        date:
          type: string
          format: date
          example: "2024-11-20"
        title:
          type: string
          example: "Riksdagens kontrollmakt och Riksrevisionen"
        docType:
          type: string
          example: bet
        summary:
          type: string
        url:
          type: string
          format: uri

    RiksdagAuthorityDetail:
      allOf:
        - $ref: "#/components/schemas/RiksdagAuthority"
        - type: object
          required: [mandate, regleringsbrev, recentDecisions]
          properties:
            mandate:
              type: string
              example: "Inrättades 2015 per polislagen. Nationell civil myndighet med ansvar för brottsförebyggande arbete, utredning och ordningshållning."
            mandateUrl:
              type: string
              format: uri
              example: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/polislag-1984387_sfs-1984-387/"
            regleringsbrev:
              type: array
              items:
                $ref: "#/components/schemas/AgencyRegleringsbrev"
            recentDecisions:
              type: array
              items:
                $ref: "#/components/schemas/AgencyDecision"

    Speech:
      type: object
      required: [id, dokId, politicianId, politicianName, party, date, snippet]
      properties:
        id:
          type: integer
        dokId:
          type: string
        anforandeNummer:
          type: string
        politicianId:
          type: string
        politicianName:
          type: string
        politicianImageUrl:
          type: string
          description: URL to politician portrait (Riksdagen CDN). May be empty.
        party:
          type: string
        date:
          type: string
          format: date-time
        topicHeading:
          type: string
        snippet:
          type: string
        speechText:
          type: string
          description: Full text — only included on /speeches/{id}, omitted from /speeches/recent
        relatedDokId:
          type: string
          description: Dok ID of the related document (interpellation, betänkande, etc.)

    RiksdagAgendaItem:
      type: object
      description: >-
        One whole government document, not a point extracted from one. Carries no
        description and no status: a description would be our paraphrase of the
        document's words, and a status ('active', 'in_progress') would be our
        unsourced claim about how the government is progressing. The list of
        documents is ours — a missing document means we have not registered it,
        never that it does not exist.
      properties:
        id:
          type: integer
        title:
          type: string
        source:
          type: string
          description: The document's short designation, e.g. "Prop. 2025/26:1".
        issuer:
          type: string
          description: Who published it — a ministry, or the parties to an agreement.
        url:
          type: string
          description: Link to the document itself, in full.
        published:
          type: string
          nullable: true
          description: Publication date as YYYY-MM-DD, null when we hold none.
      required: [id, title, source, issuer, url]

    Party:
      type: object
      properties:
        code:        { type: string }
        name:        { type: string }
        foundedYear: { type: integer, nullable: true }
        ideology:    { type: string, nullable: true }
        colorHex:    { type: string }
        textHex:     { type: string }
        active:      { type: boolean }
        websiteUrl:  { type: string, nullable: true }
        createdAt:   { type: string, format: date-time }

    Minister:
      type: object
      properties:
        id:             { type: string }
        name:           { type: string }
        title:          { type: string }
        department:     { type: string }
        departmentCode: { type: string }
        party:          { type: string }
        politicianId:   { type: string, nullable: true }
        photoUrl:       { type: string, nullable: true }
        bio:            { type: string, nullable: true }
        active:         { type: boolean }
        createdAt:      { type: string, format: date-time }

    Proposal:
      type: object
      properties:
        id:             { type: string }
        title:          { type: string }
        departmentCode: { type: string }
        riksdagYear:    { type: string }
        publishedAt:    { type: string, format: date-time, nullable: true }
        url:            { type: string }

    DepartmentGroup:
      type: object
      properties:
        department:     { type: string }
        departmentCode: { type: string }
        ministers:
          type: array
          items:
            $ref: '#/components/schemas/Minister'

    MinisterDetail:
      type: object
      properties:
        minister:
          $ref: '#/components/schemas/Minister'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'

    Committee:
      type: object
      required: [code, name, voteringar, expenditureAreas, budgetYear]
      properties:
        code:
          type: string
          description: Canonical committee code, e.g. "SoU". ALL-CAPS vintages are normalised.
        name:
          type: string
          description: >-
            Swedish name, or the code itself when we have no name for it. The
            lookup is a display aid and never a gate on what the record contains.
        voteringar:
          type: integer
          description: >-
            How many voteringar the committee decided in the period, counted as
            the record itself identifies a votering (one votering_id). A
            förslagspunkt decided by two voteringar therefore counts twice,
            because the record holds two. A count of the record, not a measure
            of importance — never presented as a ranking.
        expenditureAreas:
          type: array
          description: >-
            Utgiftsområden the committee bereder, per the Bilaga to
            riksdagsordningen. Amounts only, never a share of the total: a share
            would understate a committee whose remit exceeds its areas.
            Populated only by GET /committees/{code}; the list endpoint returns
            it empty rather than issuing one query per committee.
          items: { $ref: "#/components/schemas/CommitteeExpenditureArea" }
        budgetYear:
          type: integer
          description: >-
            The budget year the amounts in expenditureAreas were allocated for.
            Without a year an amount silently changes meaning the moment a newer
            budget is seeded, and the caller cannot derive it: omitting ?year=
            resolves to "the newest decided year", which is a moving target.

            0 on GET /committees, which populates no amounts and so has no year
            to report. Present but 0 rather than omitted, so a caller that finds
            0 knows it is looking at the list shape and not at a year we failed
            to resolve.
          example: 2026

    CommitteeExpenditureArea:
      type: object
      required: [code, name, amountKsek]
      properties:
        code: { type: string }
        name: { type: string }
        amountKsek: { type: integer, format: int64 }
