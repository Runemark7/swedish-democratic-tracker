openapi: "3.1.0"
info:
  title: Riksdagskollen API
  description: Tracks Swedish politicians' stated promises and party goals against their actual voting records in Riksdagen.
  version: "1.0.0"
  contact:
    name: Riksdagskollen

servers:
  - url: /api
    description: API base path

tags:
  - name: health
    description: Health checks
  - name: parties
    description: Party goals and scorecards
  - name: politicians
    description: Individual politician profiles and voting records
  - name: votes
    description: Vote details with proposal origin context
  - name: budget
    description: National budget (statsbudgeten) tracking and comparison
  - name: context
    description: Topic-level budget context for voters
  - name: regions
    description: Swedish regional (läns) election results and governing coalitions
  - name: municipalities
    description: Swedish municipal (kommunal) election results and governing coalitions
  - name: riksdag
    description: National level — state agency expenditure data
  - name: ministers
    description: Cabinet ministers and their proposals
  - name: committees
    description: Riksdag committees (utskott) and the utgiftsområden they bereder

paths:
  /riksdag/authorities:
    get:
      operationId: getRiksdagAuthorities
      tags: [riksdag]
      summary: State agencies with actual annual expenditure (driftkostnader)
      responses:
        "200":
          description: List of state agencies sorted by expenditure descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiksdagAuthority"
        "502":
          description: Upstream data source unavailable

  /riksdag/authorities/stats:
    get:
      operationId: getRiksdagAuthorityStats
      tags: [riksdag]
      summary: Aggregated coverage of the authorities register
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityStats"
        "500":
          description: Server error

  /riksdag/authorities/list:
    get:
      operationId: listRiksdagMyndigheter
      tags: [riksdag]
      summary: Searchable/filterable list of all state agencies (from authorities table)
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text name match (ILIKE)
        - name: underGovernment
          in: query
          schema: { type: string, enum: ["true", "false"] }
          description: Filter to agencies under the Government (true) or not (false)
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredAuthorityList"
        "500":
          description: Server error

  /riksdag/authorities/{slug}:
    get:
      operationId: getRiksdagAuthority
      tags: [riksdag]
      summary: Single state agency detail including regleringsbrev link
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: polismyndigheten
      responses:
        "200":
          description: Agency detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiksdagAuthorityDetail"
        "404":
          description: Agency not found
        "502":
          description: Upstream data source unavailable

  /party-meta:
    get:
      operationId: listPartyMeta
      summary: List all parties with metadata
      tags: [parties]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'

  /party-meta/{code}:
    get:
      operationId: getPartyMeta
      summary: Get party metadata by code
      tags: [parties]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '404':
          description: Party not found

  /ministers:
    get:
      operationId: listMinisters
      summary: List active ministers grouped by department
      tags: [ministers]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentGroup'

  /ministers/{id}:
    get:
      operationId: getMinister
      summary: Get minister detail with proposals
      tags: [ministers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinisterDetail'
        '404':
          description: Minister not found

  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /parties:
    get:
      operationId: listParties
      tags: [parties]
      summary: List all parties with summary scorecard data
      responses:
        "200":
          description: List of parties with aggregate alignment scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartySummary"

  /parties/{party}/goals:
    get:
      operationId: listPartyGoals
      tags: [parties]
      summary: List all goals for a party with alignment percentages
      parameters:
        - $ref: "#/components/parameters/PartyParam"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/Topic"
      responses:
        "200":
          description: Party goals with vote alignment data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalWithAlignment"
        "404":
          $ref: "#/components/responses/NotFound"

  /parties/{party}/goals/{goalId}/votes:
    get:
      operationId: listGoalVotes
      tags: [parties]
      summary: Detailed vote breakdown for a specific party goal
      parameters:
        - $ref: "#/components/parameters/PartyParam"
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Votes relevant to this goal with context notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalVoteBreakdown"
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians:
    get:
      operationId: listPoliticians
      tags: [politicians]
      summary: List politicians with summary statistics
      parameters:
        - name: party
          in: query
          schema:
            $ref: "#/components/schemas/PartyCode"
        - name: active
          in: query
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list of politicians
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliticianListResponse"

  /politicians/{id}:
    get:
      operationId: getPolitician
      tags: [politicians]
      summary: Full politician profile
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
      responses:
        "200":
          description: Politician profile with statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliticianProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians/{id}/promises:
    get:
      operationId: listPoliticianPromises
      tags: [politicians]
      summary: Promises extracted from speeches with vote match results
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/Topic"
      responses:
        "200":
          description: Promises with vote alignment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromiseWithMatches"
        "404":
          $ref: "#/components/responses/NotFound"

  /politicians/{id}/votes:
    get:
      operationId: listPoliticianVotes
      tags: [politicians]
      summary: Voting record with proposal origin context
      parameters:
        - $ref: "#/components/parameters/PoliticianIdParam"
        - name: session
          in: query
          schema:
            type: string
            example: "2024/25"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/Topic"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Voting record with proposal origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /votes/riksdag-feed:
    get:
      operationId: getRiksdagFeed
      tags: [votes]
      summary: Recent Riksdag betänkanden relevant to a given governance level
      parameters:
        - name: level
          in: query
          required: true
          schema:
            type: string
            enum: [region, kommun]
      responses:
        "200":
          description: Recent betänkanden with beteckning for deep-linking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiksdagFeedItem"

  /votes/{beteckning}/{punkt}:
    get:
      operationId: getVoteDetail
      tags: [votes]
      summary: Full vote detail with proposal origin and all party positions
      parameters:
        - name: beteckning
          in: path
          required: true
          schema:
            type: string
            example: "SoU12"
        - name: punkt
          in: path
          required: true
          schema:
            type: string
            example: "1"
      responses:
        "200":
          description: Full vote detail with party breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/{dokId}/full:
    get:
      operationId: getDocumentFull
      tags: [votes]
      summary: Full Riksdagen document — body HTML + intressenter list
      parameters:
        - name: dokId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full document with body and participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiksdagDocumentFull"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/{dokId}:
    get:
      operationId: getDocument
      tags: [votes]
      summary: Riksdagen document metadata (no body HTML)
      parameters:
        - name: dokId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parsed dokumentstatus metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiksdagDocument"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/years:
    get:
      operationId: listBudgetYears
      tags: [budget]
      summary: List all available budget years with totals
      responses:
        "200":
          description: Budget years with total amounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetYear"

  /budget/years/{year}:
    get:
      operationId: getBudgetYear
      tags: [budget]
      summary: Full budget breakdown for a specific year
      parameters:
        - $ref: "#/components/parameters/BudgetYearParam"
      responses:
        "200":
          description: Budget year with all expenditure area allocations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetYearDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/years/{year}/compare/{compareYear}:
    get:
      operationId: compareBudgetYears
      tags: [budget]
      summary: Side-by-side comparison of two budget years with deltas
      parameters:
        - $ref: "#/components/parameters/BudgetYearParam"
        - name: compareYear
          in: path
          required: true
          schema:
            type: integer
            example: 2024
      responses:
        "200":
          description: Comparison with delta amounts and percentages per area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetComparison"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/areas:
    get:
      operationId: listExpenditureAreas
      tags: [budget]
      summary: List all 27 expenditure areas
      responses:
        "200":
          description: Expenditure areas ordered by sort_order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenditureArea"

  /context/topic/{topic}:
    get:
      operationId: getTopicContext
      tags: [context]
      summary: Budget and economic context for a political topic
      parameters:
        - name: topic
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Topic"
      responses:
        "200":
          description: Topic context with budget trend and funding analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicContext"
        "404":
          $ref: "#/components/responses/NotFound"

  /budget/areas/{code}:
    get:
      operationId: getAreaTimeSeries
      tags: [budget]
      summary: Time series of budget amounts for one expenditure area
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "UO6"
      responses:
        "200":
          description: Yearly amounts for the expenditure area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaTimeSeries"
        "404":
          $ref: "#/components/responses/NotFound"

  /regions:
    get:
      operationId: listRegions
      tags: [regions]
      summary: List all 21 Swedish regions with election results and governing parties
      responses:
        "200":
          description: All regions with 2022 election summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionSummary"

  /regions/kpi/{kpiCode}/ranking:
    get:
      operationId: getRegionKPIRanking
      tags: [regions]
      summary: All regions ranked by a single KPI (highest first)
      parameters:
        - name: kpiCode
          in: path
          required: true
          schema:
            type: string
            example: "N60008"
      responses:
        "200":
          description: Array of rank entries sorted by value descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionKPIRankEntry"
        "502":
          description: Upstream Kolada API error

  /regions/{code}/kpi-ranks:
    get:
      operationId: getRegionKPIRanks
      tags: [regions]
      summary: Rank of a region for each strip KPI
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "09"
      responses:
        "200":
          description: Array of KPI rank entries (one per region strip KPI)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KPIRank"
        "502":
          description: Upstream Kolada API error

  /regions/{code}:
    get:
      operationId: getRegion
      tags: [regions]
      summary: Full region detail including election results per party
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "01"
            description: Two-digit region code (SCB/Valmyndigheten)
      responses:
        "200":
          description: Region with full election result breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /regions/{code}/plan:
    get:
      operationId: getRegionPlan
      tags: [regions]
      summary: Region's official annual-plan document and its own overarching goals (verbatim)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "01"
            description: Two-digit region code (SCB/Valmyndigheten)
      responses:
        "200":
          description: Plan document link plus the region's verbatim overarching goals (goals may be empty for link-only regions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /regions/{code}/budget:
    get:
      operationId: getRegionBudget
      tags: [regions]
      summary: Real budget breakdown for a region from SCB (nettokostnader by verksamhetsområde)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "06"
            description: Two-digit region code
      responses:
        "200":
          description: Budget areas with value in mnkr and percentage of total
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionBudgetArea"
        "502":
          description: Upstream SCB API error

  /regions/{code}/budget/history:
    get:
      operationId: getRegionBudgetHistory
      tags: [regions]
      summary: Multi-year budget history for a region
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: years
          in: query
          schema:
            type: integer
            default: 4
      responses:
        "200":
          description: Array of budget snapshots across years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionBudgetSnapshot"

  /regions/budget/area/{areaName}:
    get:
      operationId: getRegionAreaAcrossRegions
      tags: [regions]
      summary: Budget data for one area across all regions
      parameters:
        - name: areaName
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Array of data points, one per region
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionAreaDataPoint"

  /municipalities:
    get:
      operationId: listMunicipalities
      tags: [municipalities]
      summary: List Swedish municipalities, optionally filtered by region
      parameters:
        - name: regionCode
          in: query
          schema:
            type: string
            example: "01"
            description: Filter by two-digit region code
      responses:
        "200":
          description: Municipalities with election summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalitySummary"

  /municipalities/kpi/{kpiCode}/ranking:
    get:
      operationId: getMunicipalityKPIRanking
      tags: [municipalities]
      summary: All municipalities ranked by a single KPI (highest first)
      parameters:
        - name: kpiCode
          in: path
          required: true
          schema:
            type: string
            example: "N00900"
      responses:
        "200":
          description: Array of rank entries sorted by value descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KPIRankEntry"
        "502":
          description: Upstream Kolada API error

  /municipalities/{code}/kpi-ranks:
    get:
      operationId: getMunicipalityKPIRanks
      tags: [municipalities]
      summary: Rank of a municipality for each default KPI
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "0180"
      responses:
        "200":
          description: Array of KPI rank entries (one per default KPI)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KPIRank"
        "502":
          description: Upstream Kolada API error

  /municipalities/{code}:
    get:
      operationId: getMunicipality
      tags: [municipalities]
      summary: Full municipality detail including election results per party
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "0180"
            description: Four-digit municipality code (SCB/Valmyndigheten)
      responses:
        "200":
          description: Municipality with full election result breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MunicipalityDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /municipalities/{code}/kpi:
    get:
      operationId: getMunicipalityKPIs
      tags: [municipalities]
      summary: Kolada KPI spending metrics for a municipality
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "0180"
      responses:
        "200":
          description: Array of KPI values (up to 2 years per indicator)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalityKPIItem"
        "502":
          description: Upstream Kolada API error

  /municipalities/{code}/spending:
    get:
      operationId: getMunicipalitySpending
      tags: [municipalities]
      summary: Sector spending breakdown from Kolada (2019–2023)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "0180"
      responses:
        "200":
          description: Array of spending KPI values (8 sectors × up to 5 years)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalityKPIItem"
        "502":
          description: Upstream Kolada API error

  /municipalities/{code}/budget/history:
    get:
      operationId: getMunicipalityBudgetHistory
      tags: [municipalities]
      summary: Multi-year budget history for a municipality
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: years
          in: query
          schema:
            type: integer
            default: 4
      responses:
        "200":
          description: Array of budget snapshots across years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalityBudgetSnapshot"

  /municipalities/{code}/procurement:
    get:
      operationId: getMunicipalityProcurement
      tags: [municipalities]
      summary: Public procurement breakdown by CPV category from TED (2021–2024)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "1480"
      responses:
        "200":
          description: Top CPV procurement categories by contracted value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementCategorySummary"
        "502":
          description: Upstream TED API error

  /municipalities/{code}/population-trend:
    get:
      operationId: getMunicipalityPopulationTrend
      tags: [municipalities]
      summary: SCB population trend for a municipality (2019–2023)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "0180"
      responses:
        "200":
          description: Year-by-year population entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopulationTrendEntry"
        "502":
          description: Upstream SCB API error

  /speeches/recent:
    get:
      summary: Recent speeches across all politicians
      tags: [speeches]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: List of recent speeches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Speech"
  /speeches/{id}:
    get:
      summary: Single speech by id (full text)
      tags: [speeches]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full speech detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Speech"
        "404":
          description: Speech not found
  /speeches/by-document/{dokId}:
    get:
      summary: Speeches whose rel_dok_id matches a betänkande
      tags: [speeches]
      parameters:
        - in: path
          name: dokId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of speeches in chronological debate order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Speech"
  /speeches/by-politician/{intressentId}:
    get:
      summary: Recent speeches by one politician
      tags: [speeches]
      parameters:
        - in: path
          name: intressentId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Speeches by one politician, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Speech"
  /speeches/by-party/{party}:
    get:
      summary: Recent speeches by all members of one party
      tags: [speeches]
      parameters:
        - in: path
          name: party
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Speeches by party members, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Speech"

  /committees:
    get:
      operationId: listCommittees
      summary: Committees that decided at least one votering in a mandate period
      tags: [committees]
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string }
          description: Mandate period code, e.g. "2022-2026".
      responses:
        "200":
          description: >-
            Committees, alphabetical by code. expenditureAreas is empty here —
            only GET /committees/{code} populates it.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Committee" }
        "404":
          description: >-
            No such mandate period. A period we do not hold is refused rather
            than answered with an empty list, which would read as "this
            parliament decided nothing".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /committees/{code}:
    get:
      operationId: getCommittee
      summary: One committee with the utgiftsområden it bereder
      tags: [committees]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          description: >-
            Committee code, matched case-insensitively — "fiu" and "FiU" are the
            same committee.
        - name: period
          in: query
          required: true
          schema: { type: string }
        - name: year
          in: query
          required: false
          schema: { type: integer }
          description: >-
            Budget year for the amounts. Defaults to the newest year with
            decided figures. A year without decided figures is a 400, never a
            200 carrying zero amounts.
      responses:
        "200":
          description: The committee, with the utgiftsområden it bereder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Committee" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such mandate period, or that committee decided nothing in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /committees/{code}/goals:
    get:
      operationId: listGoalsByCommittee
      summary: Party goals whose relevant_committees contains this committee
      description: >-
        The LOVAT row. Goals are the parties' own stated aims, alphabetical by
        party. An empty result means our seed data holds no goals for this area,
        which the caller must state as our gap and never as the parties' silence.
      tags: [committees]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Goals, alphabetical by party. relevantVotes is not computed on
            this endpoint and is always 0 here — it is not a claim that
            nothing matched. The matching service scores one party's
            scorecard at a time, and this endpoint spans every party;
            read relevantVotes from GET /parties/{party}/goals instead.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoalWithAlignment" }

  /committees/{code}/votes:
    get:
      operationId: listVotesByCommittee
      summary: Voteringar decided by this committee, with each party's position
      description: >-
        The RÖSTAT row. Each item is one förslagspunkt with the dominant
        position every party took, stated as fact only, alphabetical by party
        within a votering, no share or rank. A party appears as "Delad" when
        its members split evenly between two or more positions, rather than
        the record silently picking one. Ballots cast under no party
        affiliation ("-") are excluded — they remain in the record and on the
        decision page, they simply do not occupy a party's slot here. Carries
        no decision date: votes hold only system_datum, which is when
        Riksdagen last touched the record, so the record cannot be shown in
        chronological order. Ordered by riksmöte, then the numeric part of the
        beteckning, then the numeric förslagspunkt.
      tags: [committees]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          description: >-
            Committee code, matched case-insensitively — "sou" and "SoU" are
            the same committee.
        - name: period
          in: query
          required: true
          schema: { type: string }
          description: >-
            Mandate period code, e.g. "2022-2026" — required for the same
            reason GET /committees/{code} requires it: an unscoped query would
            blend mandate periods together the moment the record holds more
            than one.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of voteringar plus the total for the committee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitteeVoteringPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: >-
            No such mandate period. A period we do not hold is refused rather
            than answered with an empty page, which would read as "this
            committee decided nothing".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  parameters:
    PartyParam:
      name: party
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PartyCode"
    PoliticianIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: Riksdagen intressent_id
    BudgetYearParam:
      name: year
      in: path
      required: true
      schema:
        type: integer
        example: 2025

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string

    PartyCode:
      type: string
      enum: [S, M, SD, C, V, KD, L, MP, unknown]
      description: Swedish party abbreviation

    Topic:
      type: string
      enum:
        - sjukvard
        - forsvar
        - invandring
        - skatt
        - skola
        - klimat
        - brott
        - bostad
        - arbete
        - energi
        - pension
        - other

    VoteResult:
      type: string
      enum: [Ja, Nej, Avstår, Frånvarande]

    ProposalType:
      type: string
      enum: [prop, mot, bet]
      description: "prop=government bill, mot=party motion, bet=committee report"

    Specificity:
      type: string
      enum: [concrete, directional, rhetorical]

    Politician:
      type: object
      required: [intressentId, firstName, lastName, party, isActive]
      properties:
        intressentId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        party:
          $ref: "#/components/schemas/PartyCode"
        constituency:
          type: string
        imageUrl:
          type: string
          format: uri
        isActive:
          type: boolean

    PoliticianSummary:
      allOf:
        - $ref: "#/components/schemas/Politician"
        - type: object
          properties:
            totalVotes:
              type: integer
            promiseCount:
              type: integer
            alignmentPct:
              type: number
              format: float
              description: Overall promise-to-vote alignment percentage

    PoliticianProfile:
      allOf:
        - $ref: "#/components/schemas/PoliticianSummary"
        - type: object
          properties:
            recentSpeeches:
              type: array
              items:
                $ref: "#/components/schemas/SpeechSummary"

    PoliticianListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PoliticianSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    SpeechSummary:
      type: object
      required: [id, date, topicHeading]
      properties:
        id:
          type: integer
        dokId:
          type: string
        date:
          type: string
          format: date
        topicHeading:
          type: string

    Vote:
      type: object
      required: [id, voteringId, politicianId, party, voteResult, beteckning, forslagspunkt, session]
      properties:
        id:
          type: integer
        voteringId:
          type: string
        politicianId:
          type: string
        party:
          $ref: "#/components/schemas/PartyCode"
        voteResult:
          $ref: "#/components/schemas/VoteResult"
        beteckning:
          type: string
          description: Committee report ID e.g. SoU12
        forslagspunkt:
          type: string
        session:
          type: string
          example: "2024/25"
        dokId:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"
        documentTitle:
          type: string
        createdAt:
          type: string
          format: date-time

    VoteListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    VoteDetail:
      type: object
      required: [beteckning, forslagspunkt, documentTitle, partyBreakdown]
      properties:
        beteckning:
          type: string
        forslagspunkt:
          type: string
        dokId:
          type: string
        documentTitle:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"
        session:
          type: string
        partyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PartyVotePosition"
        contextNote:
          type: string
          description: AI-generated explanation of political context
        date:
          type: string
          description: "Decision date from Riksdagen, YYYY-MM-DD"
        status:
          type: string
          description: "Authoritative outcome: Bifall | Avslag | Återremiss"
        subtitle:
          type: string
        summary:
          type: string
          description: "Plain-text summary of the betänkande"

    PartyVotePosition:
      type: object
      required: [party, jaCount, nejCount, avstarCount, franvarandeCount]
      properties:
        party:
          $ref: "#/components/schemas/PartyCode"
        jaCount:
          type: integer
        nejCount:
          type: integer
        avstarCount:
          type: integer
        franvarandeCount:
          type: integer
        dominantVote:
          $ref: "#/components/schemas/VoteResult"

    Goal:
      type: object
      required: [id, party, goalText, topic, specificity, sourceDocument]
      properties:
        id:
          type: integer
        party:
          $ref: "#/components/schemas/PartyCode"
        goalText:
          type: string
        topic:
          $ref: "#/components/schemas/Topic"
        specificity:
          $ref: "#/components/schemas/Specificity"
        sourceDocument:
          type: string
          example: "Valmanifest 2022"
        sourceUrl:
          type: string
          description: Live URL to the party's published source document for this goal.
          example: "https://moderaterna.se/.../valmanifest_2022.pdf"
        sourceQuote:
          type: string
          description: Verbatim excerpt from the source document the goal is derived from.
        keywords:
          type: array
          items:
            type: string
        relevantCommittees:
          type: array
          items:
            type: string

    GoalWithAlignment:
      allOf:
        - $ref: "#/components/schemas/Goal"
        - type: object
          properties:
            relevantVotes:
              type: integer
              description: >-
                Vote points matched to this goal — a fact about our matching.
                The alignment percentage was retired: it systematically
                disadvantaged opposition parties, scoring a party that voted Nej
                to the rejection of its own motion as breaking its own promise.

    PartyPosition:
      type: object
      required: [party, position]
      description: >-
        How one party voted on a förslagspunkt — the position most of its
        members took. Stated as fact, never scored against a promise. Never
        carries the record's "-" placeholder for ballots with no party
        affiliation: this is a per-party list, and "-" is not a party.
      properties:
        party:
          $ref: "#/components/schemas/PartyCode"
        position:
          type: string
          enum: [Ja, Nej, Avstår, Frånvarande, Delad]
          description: >-
            The position this party's members took. "Delad" means the
            party's members split evenly between two or more positions —
            partiets ledamöter delade sig jämnt mellan två eller flera
            positioner — and is emitted instead of resolving the tie to
            whichever position happens to sort first.

    CommitteeVotering:
      type: object
      required:
        [voteringId, beteckning, forslagspunkt, documentTitle, riksmote,
         decidedByMultipleVoteringar, partyPositions]
      description: >-
        One decided förslagspunkt with every party's position. Carries no
        date: votes hold only system_datum, which is when Riksdagen last
        touched the record, so presenting it as a decision date would repeat
        a bug the site already removed.
      properties:
        voteringId:
          type: string
          description: >-
            Distinguishes the 18 förslagspunkter in 2022-2026 that were
            genuinely decided by two separate voteringar — same beteckning
            and förslagspunkt, different votering, possibly contradictory
            party positions.
        beteckning:
          type: string
        forslagspunkt:
          type: string
        documentTitle:
          type: string
        riksmote:
          type: string
          example: "2024/25"
        decidedByMultipleVoteringar:
          type: boolean
          description: >-
            True when the record holds more than one votering for this
            (riksmöte, beteckning, förslagspunkt). Such a pair renders as two
            rows that are identical apart from their party positions, which can
            be opposite — without this flag they read as parties reversing
            themselves on one question for no reason.

            Computed server-side over the committee's whole record before
            paging, because a caller sees one page at a time and a pair can
            straddle a page boundary: NU7 punkt 2 in 2025/26 sits at indices
            149 and 150, so a client counting duplicates within its own page
            marks neither half.
        partyPositions:
          type: array
          items: { $ref: "#/components/schemas/PartyPosition" }

    CommitteeVoteringPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommitteeVotering" }
        total:
          type: integer
          description: Total voteringar for this committee, independent of paging

    GoalVoteBreakdown:
      type: object
      required: [goal, matches]
      properties:
        goal:
          $ref: "#/components/schemas/GoalWithAlignment"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GoalVoteMatch"

    GoalVoteMatch:
      type: object
      required: [beteckning, forslagspunkt, relevanceScore, alignedDirection]
      properties:
        beteckning:
          type: string
        forslagspunkt:
          type: string
        relevanceScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
        alignedDirection:
          $ref: "#/components/schemas/VoteResult"
        explanation:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"
        contextNote:
          type: string
        documentTitle:
          type: string
        partyAlignmentPct:
          type: number
          format: float
          description: What % of party members voted in the aligned direction

    RecordCoverage:
      type: object
      required: [mandate, expected, ingested, unreachable, byRiksmote]
      properties:
        mandate:
          $ref: "#/components/schemas/MandatePeriod"
        expected:
          type: integer
          description: Riksdagen's count of voteringar in the mandate period.
        ingested:
          type: integer
          description: How many of those the site holds.
        unreachable:
          type: integer
          description: >-
            Voteringar Riksdagen lists that carry no beteckning and therefore
            cannot be fetched. Reported so a shortfall is explained rather than
            left as an unexplained gap.
        lastDecisionDate:
          type: string
          nullable: true
          description: Date of the newest decision held. Not an ingest timestamp.
        denominatorCheckedAt:
          type: string
          nullable: true
          description: >-
            When `expected` was last read from Riksdagen — the oldest such date
            across the period's riksmöten, since the figure is only as fresh as
            its stalest part. `ingested` is counted live and always current;
            `expected`, `unreachable` and `lastDecisionDate` come from a
            separate enumeration pass, so their age is stated rather than
            implied. Null means the denominator has never been established.
        byRiksmote:
          type: array
          items:
            $ref: "#/components/schemas/RiksmoteRecord"

    MandatePeriod:
      type: object
      required: [code, label, ended]
      properties:
        code:
          type: string
        label:
          type: string
        ended:
          type: boolean
          description: >-
            Whether the period has closed. Once it has, the record is final and
            the incoming parliament accumulates a separate one.

    RiksmoteRecord:
      type: object
      required: [riksmote, expected, ingested, unreachable]
      properties:
        riksmote:
          type: string
        expected:
          type: integer
        ingested:
          type: integer
        unreachable:
          type: integer
        lastDecisionDate:
          type: string
          nullable: true
        denominatorCheckedAt:
          type: string
          nullable: true
          description: When this riksmöte's `expected` was last read from Riksdagen.

    PartySummary:
      type: object
      required: [party, totalGoals]
      properties:
        party:
          $ref: "#/components/schemas/PartyCode"
        totalGoals:
          type: integer
        topicBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/TopicAlignment"

    TopicAlignment:
      type: object
      required: [topic, goalCount]
      properties:
        topic:
          $ref: "#/components/schemas/Topic"
        goalCount:
          type: integer
          description: All goals in this topic, including unscorable ones.

    Promise:
      type: object
      required: [id, politicianId, promiseText, topic, specificity]
      properties:
        id:
          type: integer
        politicianId:
          type: string
        speechId:
          type: integer
        speechDate:
          type: string
          format: date
        speechTopic:
          type: string
        promiseText:
          type: string
        topic:
          $ref: "#/components/schemas/Topic"
        specificity:
          $ref: "#/components/schemas/Specificity"
        keywords:
          type: array
          items:
            type: string

    PromiseWithMatches:
      allOf:
        - $ref: "#/components/schemas/Promise"
        - type: object
          properties:
            voteMatches:
              type: array
              items:
                $ref: "#/components/schemas/PromiseVoteMatch"

    PromiseVoteMatch:
      type: object
      required: [voteId, relevanceScore, alignment]
      properties:
        voteId:
          type: integer
        beteckning:
          type: string
        forslagspunkt:
          type: string
        documentTitle:
          type: string
        voteResult:
          $ref: "#/components/schemas/VoteResult"
        relevanceScore:
          type: number
          format: float
        alignment:
          type: string
          enum: [supports, contradicts, unclear]
        explanation:
          type: string
        proposedByParty:
          $ref: "#/components/schemas/PartyCode"
        proposalType:
          $ref: "#/components/schemas/ProposalType"

    ExpenditureArea:
      type: object
      required: [code, name, sortOrder]
      properties:
        code:
          type: string
          example: "UO6"
        name:
          type: string
          example: "Försvar och samhällets krisberedskap"
        description:
          type: string
        sortOrder:
          type: integer

    BudgetYear:
      type: object
      required: [year, status, totalKsek]
      properties:
        year:
          type: integer
          example: 2025
        status:
          type: string
          enum: [decided, proposed]
        totalKsek:
          type: integer
          format: int64
          description: Total budget in thousands of kronor

    BudgetAllocation:
      type: object
      required: [area, amountKsek]
      properties:
        area:
          $ref: "#/components/schemas/ExpenditureArea"
        amountKsek:
          type: integer
          format: int64
        amountFormatted:
          type: string
          description: "Human-readable amount, e.g. '145,2 mdkr'"

    BudgetDocumentRef:
      type: object
      required: [type, title, url, description]
      properties:
        type:
          type: string
          enum: [proposition, committee_report]
          description: Document type
        title:
          type: string
          example: "Prop. 2024/25:1"
        url:
          type: string
          format: uri
          description: Link to the document on riksdagen.se
        description:
          type: string
          example: "Budgetpropositionen för 2025"

    BudgetYearDetail:
      type: object
      required: [year, status, totalKsek, allocations]
      properties:
        year:
          type: integer
        status:
          type: string
          enum: [decided, proposed]
        totalKsek:
          type: integer
          format: int64
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/BudgetAllocation"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BudgetDocumentRef"
          description: Links to relevant budget proposition and committee reports

    BudgetComparisonRow:
      type: object
      required: [area, baseAmountKsek, compareAmountKsek, deltaKsek, deltaPct]
      properties:
        area:
          $ref: "#/components/schemas/ExpenditureArea"
        baseAmountKsek:
          type: integer
          format: int64
        compareAmountKsek:
          type: integer
          format: int64
        deltaKsek:
          type: integer
          format: int64
          description: compareAmount - baseAmount
        deltaPct:
          type: number
          format: float
          description: Percentage change from base to compare year

    BudgetComparison:
      type: object
      required: [baseYear, compareYear, rows, baseTotalKsek, compareTotalKsek]
      properties:
        baseYear:
          type: integer
        compareYear:
          type: integer
        baseTotalKsek:
          type: integer
          format: int64
        compareTotalKsek:
          type: integer
          format: int64
        totalDeltaKsek:
          type: integer
          format: int64
        totalDeltaPct:
          type: number
          format: float
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BudgetComparisonRow"

    AreaTimeSeries:
      type: object
      required: [area, entries]
      properties:
        area:
          $ref: "#/components/schemas/ExpenditureArea"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AreaTimeSeriesEntry"

    AreaTimeSeriesEntry:
      type: object
      required: [year, amountKsek]
      properties:
        year:
          type: integer
        amountKsek:
          type: integer
          format: int64
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BudgetDocumentRef"
          description: Links to the area-specific budget proposition volume

    BudgetTrendEntry:
      type: object
      required: [year, amountKsek, amountFormatted]
      properties:
        year:
          type: integer
