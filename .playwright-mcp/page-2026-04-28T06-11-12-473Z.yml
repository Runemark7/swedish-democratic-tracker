                - paragraph [ref=e40]: Statskontoret har avslutat sin årliga revision av hur svenska myndigheter hanterar EU-medel som betalas ut till stödmottagare. Statskontoret bedömer att den samlade svenska förvaltningen av EU-stöd fungerar bra.
