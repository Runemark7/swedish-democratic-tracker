                - paragraph [ref=e47]: På årets förvaltningspolitiska dag diskuterades regeringens AI-politik, AI och rättssäkerhet samt hur statsförvaltningens AI-användning kan ta ett större kliv framåt. Erfarenheterna från myndigheterna som deltog i programmet visar att det finns möjligheter att utveckla verksamheten med hjälp av AI, men att riskerna ställer krav på tydlig styrning och kontroll.
