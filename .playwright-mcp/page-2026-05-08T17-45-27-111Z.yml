      - code [ref=e44]: "curl -s -X POST \\ 'https://api.scb.se/OV0104/v1/doris/sv/ssd/ME/ME0104/ME0104A/Kfmandat' \\ -H 'Content-Type: application/json' \\ -d '{\"query\":[{\"code\":\"Region\",\"selection\":{\"filter\":\"item\",\"values\":[\"1490\"]}},{\"code\":\"Parti\",\"selection\":{\"filter\":\"item\",\"values\":[\"M\",\"C\",\"FP\",\"KD\",\"MP\",\"S\",\"V\",\"SD\",\"ÖVRIGA\"]}},{\"code\":\"ContentsCode\",\"selection\":{\"filter\":\"item\",\"values\":[\"ME0104C1\"]}},{\"code\":\"Tid\",\"selection\":{\"filter\":\"item\",\"values\":[\"2022\"]}}],\"response\":{\"format\":\"json\"}}'"
      - paragraph [ref=e45]: "Metadata (vilka kommuner finns, vilka år, vilka partier):"
      - code [ref=e47]: curl -s 'https://api.scb.se/OV0104/v1/doris/sv/ssd/ME/ME0104/ME0104A/Kfmandat'
