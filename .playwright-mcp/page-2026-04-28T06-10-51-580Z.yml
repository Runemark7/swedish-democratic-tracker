          - paragraph
          - paragraph [ref=e29]: Statskontoret publicerar Statsliggaren som är en sammanställning av samtliga myndigheters regleringsbrev. Regleringsbreven publiceras när de är expedierade i Hermes. Det är departementen som lägger in expeditionsdatum vilket kan vara allt från 1 till 14 dagar efter att regleringsbrevet har beslutats.
          - paragraph [ref=e30]: Regleringsbreven uppdateras löpande under året.
          - paragraph [ref=e31]: Från och med 2003 publiceras Statsliggaren endast i elektronisk form. Tidigare regleringsbrev finns hos välsorterade bibliotek. De kan även begäras ut hos upprättande part (Regeringskansliet) eller mottagande myndighet.
