                    - listitem [ref=e361]:
                      - generic [ref=e362]:
                        - link " Ny kärnkraft är en samhällsinvestering som förutsätter en ny roll för staten" [ref=e363] [cursor=pointer]:
                          - /url: /pressmeddelanden/2026/04/ny-karnkraft-ar-en-samhallsinvestering-som-forutsatter-en-ny-roll-for-staten/
                        - paragraph [ref=e364]: Ny kärnkraft innebär ett långsiktigt åtagande för samhället. Den kräver privata investeringar såväl som insatser från statens sida. Regeringen föreslår nu i vårändringsbudgeten för 2026 dels ett statligt majoritetsägande i Videberg Kraft AB, dels att staten tar en roll i finansieringen av det framtida systemet för omhändertagandet av radioaktivt avfall och använt kärnbränsle genom att lyfta av risk för den som gör de första investeringarna. Den som producerar avfallet ska även fortsatt stå för sin del av kostnaderna.
