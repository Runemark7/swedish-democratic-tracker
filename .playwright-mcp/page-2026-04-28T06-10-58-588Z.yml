                        - paragraph [ref=e342]: Måndagen den 13 april besöker infrastruktur- och bostadsminister Andreas Carlson Karlstad och Karlskoga. Under besöket kommer statsrådet besöka lokala företag, samt delta vid Tillväxtdagen i Karlstad. Utöver företagsbesök kommer Andreas Carlson även hålla en pressträff i Karlstad för att presentera några av regeringens prioriteringar i vårändringsbudgeten.
