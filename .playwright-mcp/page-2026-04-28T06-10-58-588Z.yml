                        - paragraph [ref=e352]: Under mandatperioden har omfattande steg tagits i omläggningen av kriminalpolitiken och rättsväsendet tillförts stora resurser. I vårändringsbudgeten för 2026 föreslås ytterligare 270 miljoner kronor för detta arbete. Det handlar om medel till Polismyndigheten för stärkt teknisk förmåga, till Statens institutionsstyrelse (SiS) för att förbereda för elektronisk övervakning av barn och unga samt till anslaget för brottsskadeersättning för att säkerställa att brottsoffer får sin berättigade ersättning utan onödiga dröjsmål.
