## Production overrides — merge on top of values.yaml
backend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-api
    pullPolicy: Always
    tag: 44926cf72471baa410863d0d8a3339eb2c08ffe3
  imagePullSecrets:
    - name: ghcr-pull-secret
  env:
    CORS_ALLOWED_ORIGIN: "https://sdt.runevibe.se"
    SEED_ELECTIONS: "true"
  # Same split as values.yaml. Liveness stays off the database.
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
frontend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-frontend
    pullPolicy: Always
    tag: 44926cf72471baa410863d0d8a3339eb2c08ffe3
  imagePullSecrets:
    - name: ghcr-pull-secret
## One-off voting-record backfill. Full contract in values.yaml.
##
## Run 3 (2026-10-27) filled 2016/17–2021/22. The record is 15 857
## voteringar and 5.53M ballots (790 MB). The Job then exited Failed:
## data.riksdagen.se reset connections from 2024/25 onward, and the two
## retry pods failed immediately. Those later sessions were already stored.
##
## Disabled so Argo prunes riksdagskollen-backfill-3. The Job pod template
## is immutable; leaving this on keeps the app OutOfSync. The next run
## must bump runId — do not reuse "3".
backfill:
  enabled: false
  runId: "3"
  period: ""
ingress:
  host: sdt.runevibe.se
  tlsSecretName: sdt-runevibe-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
## Self-hosted Umami analytics. First deploy brings up Umami + its Postgres;
## the tracking tag stays off until umami.frontend.* is filled in after the
## website is created in the Umami UI (see docs/runbooks/umami-analytics.md).
## TLS for analytics.runevibe.se is auto-provisioned via the cert-manager
## annotation inherited from ingress.annotations above. Requires a DNS record:
## analytics.runevibe.se -> the ingress load balancer.
umami:
  # Disabled to free RAM on the 4GB Hetzner node (was ~260Mi + postgres).
  enabled: false
  ingress:
    host: analytics.runevibe.se
    tlsSecretName: analytics-runevibe-tls
  frontend:
    scriptUrl: "https://analytics.runevibe.se/script.js"
    websiteId: "a4401c8a-dfdb-46b5-9bce-87b3d4a17d7a"
