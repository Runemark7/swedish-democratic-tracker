## Production overrides — merge on top of values.yaml
backend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-api
    pullPolicy: Always
    tag: 8dfe2a5f3f8f214d6994405dc0ad0711c9e96e25
  imagePullSecrets:
    - name: ghcr-pull-secret
  env:
    CORS_ALLOWED_ORIGIN: "https://sdt.runevibe.se"
    SEED_ELECTIONS: "true"
frontend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-frontend
    pullPolicy: Always
    tag: 8dfe2a5f3f8f214d6994405dc0ad0711c9e96e25
  imagePullSecrets:
    - name: ghcr-pull-secret
postgresql:
  enabled: false
ingress:
  host: sdt.runevibe.se
  tlsSecretName: sdt-runevibe-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
