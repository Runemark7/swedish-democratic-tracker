## Production overrides — merge on top of values.yaml
backend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-api
    pullPolicy: Always
    tag: fbdf1806de27c6194c19a7192f20884332f17e1e
  imagePullSecrets:
    - name: ghcr-pull-secret
  env:
    CORS_ALLOWED_ORIGIN: "https://sdt.runevibe.se"
    SEED_ELECTIONS: "true"
  # Same split as values.yaml. Liveness stays off the database.
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
frontend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-frontend
    pullPolicy: Always
    tag: fbdf1806de27c6194c19a7192f20884332f17e1e
  imagePullSecrets:
    - name: ghcr-pull-secret
## One-off voting-record backfill. Full contract in values.yaml.
##
## Run 3. Runs 1 and 2 (August 2026) died on Neon's 512 MB project cap,
## part way through 2016/17. The database is now self-hosted Postgres 18
## (~415 MB used, ~45 GB free), so that cap is gone.
##
## period is empty: the Job walks every mandate_periods row, oldest first,
## which is 2002-2006 through 2026-2030. Writes upsert on votering_id and
## (votering, member), so sessions already held are re-confirmed and the
## gap — partial 2016/17, nothing for 2017/18–2021/22 — is filled rather
## than duplicated. The command does not touch the votes cursor. The
## nightly chain only fetches the current riksmöte, and this walk reaches
## that session last.
##
## The pod limit stays 512Mi. It holds one betänkande's ballots at a time,
## which fits the 4 GB node next to the API. The two-hour deadline stays:
## a full historical walk measured about 45 minutes, and run 2 reached
## 2016/17 in 27.
##
## Set enabled back to false after the Job is Complete, before the next
## sync. ttlSecondsAfterFinished deletes the Job after a day; a later
## sync with enabled still true creates it again and walks Riksdagen
## from 2002 once more. While the Job exists, its pod template is
## immutable, so an image-tag bump in this file will fail the upgrade
## until enabled is false.
backfill:
  enabled: true
  runId: "3"
  period: ""
ingress:
  host: sdt.runevibe.se
  tlsSecretName: sdt-runevibe-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
## Self-hosted Umami analytics. First deploy brings up Umami + its Postgres;
## the tracking tag stays off until umami.frontend.* is filled in after the
## website is created in the Umami UI (see docs/runbooks/umami-analytics.md).
## TLS for analytics.runevibe.se is auto-provisioned via the cert-manager
## annotation inherited from ingress.annotations above. Requires a DNS record:
## analytics.runevibe.se -> the ingress load balancer.
umami:
  # Disabled to free RAM on the 4GB Hetzner node (was ~260Mi + postgres).
  enabled: false
  ingress:
    host: analytics.runevibe.se
    tlsSecretName: analytics-runevibe-tls
  frontend:
    scriptUrl: "https://analytics.runevibe.se/script.js"
    websiteId: "a4401c8a-dfdb-46b5-9bce-87b3d4a17d7a"
