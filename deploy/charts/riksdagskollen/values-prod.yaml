## Production overrides — merge on top of values.yaml
backend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-api
    pullPolicy: Always
    tag: 7c1a828c48c2babcedbd5e871e7b1adeeaad119e
  imagePullSecrets:
    - name: ghcr-pull-secret
  env:
    CORS_ALLOWED_ORIGIN: "https://sdt.runevibe.se"
    SEED_ELECTIONS: "true"
frontend:
  replicas: 1
  image:
    repository: ghcr.io/runemark7/riksdagskollen-frontend
    pullPolicy: Always
    tag: 7c1a828c48c2babcedbd5e871e7b1adeeaad119e
  imagePullSecrets:
    - name: ghcr-pull-secret
ingress:
  host: sdt.runevibe.se
  tlsSecretName: sdt-runevibe-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
