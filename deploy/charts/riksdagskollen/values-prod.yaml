## One-off voting-record backfill. Full contract in values.yaml.
##
## Run 2. Run 1 (2026-08-22) failed within two minutes -- every write returned
##   ERROR: could not extend file because project size limit (512 MB)
##   has been exceeded (SQLSTATE 53100)
## Both causes are now gone: the database limit was lifted, and 000039/000040
## split the record into voteringar and ballots, which cut it 2.9x by removing
## the votering-level fields that were repeated on all ~350 ballots of every
## votering. The full six-period record measures 663 MB rather than 1.9 GB.
##
## period is empty, so the run covers all six periods oldest first. It also
## repairs the 547 voteringar of 2002-2006 that run 1 wrote before it hit the
## wall: every write is an upsert, so the partial period is corrected rather
## than duplicated.
##
## Set enabled back to false once the Job reports complete, or the next sync
## recreates it.
## Run 2 (2026-08-23) also stopped on the 512 MB limit, 27 minutes in, part
## way through 2016/17. The cap is still 512 MB despite being reported as
## lifted -- the error text names the figure, so check what the Neon project
## actually reports before enabling this again.
##
## It did get much further than run 1, because 000039/000040 cut the record
## 2.9x. Three periods landed complete and verified against the local run:
## 2002-2006 (2 819), 2006-2010 (1 972), 2010-2014 (2 656). 2014-2018 is
## partial at 1 286 of 2 585 and 2018-2022 was never reached.
##
## Re-running is safe and resumes rather than restarts: every write is an
## upsert, so the three complete periods are re-confirmed and the partial one
## is filled in. Only the remaining ~4 500 voteringar need storage.
backfill:
  enabled: false
  runId: "2"
  period: ""
ingress:
  host: sdt.runevibe.se
  tlsSecretName: sdt-runevibe-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
## Self-hosted Umami analytics. First deploy brings up Umami + its Postgres;
## the tracking tag stays off until umami.frontend.* is filled in after the
## website is created in the Umami UI (see docs/runbooks/umami-analytics.md).
## TLS for analytics.runevibe.se is auto-provisioned via the cert-manager
## annotation inherited from ingress.annotations above. Requires a DNS record:
## analytics.runevibe.se -> the ingress load balancer.
umami:
  enabled: true
  ingress:
    host: analytics.runevibe.se
    tlsSecretName: analytics-runevibe-tls
  frontend:
    scriptUrl: "https://analytics.runevibe.se/script.js"
    websiteId: "a4401c8a-dfdb-46b5-9bce-87b3d4a17d7a"
