## Backend API
backend:
  image:
    repository: ghcr.io/your-org/riksdagskollen-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  env:
    PORT: "8080"
    MIGRATIONS_PATH: "file:///migrations"
    CORS_ALLOWED_ORIGIN: "https://riksdagskollen.example.com"
  # DATABASE_URL injected from secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532     # distroless nonroot uid
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

## Frontend
frontend:
  image:
    repository: ghcr.io/your-org/riksdagskollen-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  # In k8s the Ingress routes /api to the backend Service directly, so nginx
  # never proxies it. Still must be a valid URL for nginx template parsing.
  backendUrl: http://riksdagskollen-backend
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 101       # nginx user
    runAsGroup: 101
    readOnlyRootFilesystem: false  # nginx writes temp files; use tmpfs volumes
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

## Ingress
ingress:
  enabled: true
  className: nginx
  tls: true
  tlsSecretName: riksdagskollen-tls
  host: riksdagskollen.example.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

## Secret name for database credentials
## Must be pre-created with key: DATABASE_URL
dbSecretName: riksdagskollen-db-secret

migrations:
  enabled: false

## Voting-record backfill — a one-off Job, not part of a normal deploy.
##
## The daily worker only fetches forward from its cursor, so it cannot recover a
## gap. This fills one. Left disabled: enabling it on every sync would walk 24
## years of Riksdagen's API on each upgrade.
##
## To run: set enabled=true, bump runId, sync. Watch it with
##   kubectl logs -f job/riksdagskollen-backfill-<runId> -n riksdagskollen
## then set enabled=false again so the next sync does not recreate it.
backfill:
  enabled: false
  ## Names the run. Bump for each new run — a Job's pod template is immutable,
  ## so reusing a name fails instead of re-running.
  runId: "1"
  ## One mandate period, e.g. "2018-2022". Empty means every period declared in
  ## mandate_periods, oldest first.
  period: ""
  ## Pause between Riksdagen API requests. Not a throttle we are forced into —
  ## it is deliberate politeness toward a public service we depend on.
  delay: 200ms
  backoffLimit: 2
  ## Two hours. A full six-period run measured ~45 minutes locally; this leaves
  ## room for a slow upstream without letting a wedged run sit forever.
  activeDeadlineSeconds: 7200
  ## One day, so the coverage report stays readable after the run finishes.
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      ## Network-bound rather than compute-bound: it holds one betänkande's
      ## ballots in memory at a time, not a riksmöte's.
      cpu: 500m
      memory: 512Mi

## Umami — self-hosted, cookieless web analytics (privacy-friendly, no consent
## banner needed). Disabled by default; enable per environment.
##
## Required pre-created secrets when enabled:
##   umami.db.secretName       key: POSTGRES_PASSWORD
##   umami.app.secretName      keys: DATABASE_URL, APP_SECRET
##     DATABASE_URL must point at the umami-db service and match POSTGRES_PASSWORD,
##     e.g. postgresql://umami:<pw>@riksdagskollen-umami-db:5432/umami
##     APP_SECRET is any long random string (used to sign Umami sessions).
##
## After first deploy: log in to Umami, create the website, copy its UUID into
## umami.frontend.websiteId, copy the script URL into umami.frontend.scriptUrl,
## then redeploy so the frontend injects the tracking tag.
umami:
  enabled: false
  image:
    repository: ghcr.io/umami-software/umami
    tag: postgresql-latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  port: 3000
  # Secret with keys DATABASE_URL and APP_SECRET
  app:
    secretName: riksdagskollen-umami-secret
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  # Dedicated Postgres for Umami
  db:
    image:
      repository: postgres
      tag: "17-alpine"
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    database: umami
    user: umami
    # Secret with key POSTGRES_PASSWORD
    secretName: riksdagskollen-umami-db-secret
    storageSize: 2Gi
    storageClassName: ""   # "" = cluster default StorageClass
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  # Tracking-tag values injected into the frontend (see umami-analytics docs).
  # Leave empty until the website exists in Umami; empty = no tag emitted.
  frontend:
    scriptUrl: ""    # e.g. https://analytics.riksdagskollen.example.com/script.js
    websiteId: ""    # UUID from Umami after creating the website
  # Ingress for the Umami dashboard + script host (separate subdomain)
  ingress:
    enabled: true
    host: analytics.riksdagskollen.example.com
    tls: true
    tlsSecretName: riksdagskollen-umami-tls
