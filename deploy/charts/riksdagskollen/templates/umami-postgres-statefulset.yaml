{{- if .Values.umami.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "riksdagskollen.fullname" . }}-umami-db
  labels:
    {{- include "riksdagskollen.labels" . | nindent 4 }}
    {{- include "riksdagskollen.umamiDb.selectorLabels" . | nindent 4 }}
spec:
  # Dedicated Postgres for Umami only — isolated from the app database so an
  # analytics outage cannot affect civic data, and vice versa.
  serviceName: {{ include "riksdagskollen.fullname" . }}-umami-db
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "riksdagskollen.umamiDb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "riksdagskollen.labels" . | nindent 8 }}
        {{- include "riksdagskollen.umamiDb.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.umami.db.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.umami.db.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # postgres user in official image
        runAsGroup: 999
        fsGroup: 999        # make the PVC writable by postgres
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.umami.db.image.repository }}:{{ .Values.umami.db.image.tag }}"
          imagePullPolicy: {{ .Values.umami.db.image.pullPolicy }}
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.umami.db.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.umami.db.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.umami.db.secretName }}
                  key: POSTGRES_PASSWORD
            # Keep data in a subdir so initdb does not trip over the PV's
            # lost+found directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # postgres writes to /var/run, /tmp
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.umami.db.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.umami.db.user }}", "-d", "{{ .Values.umami.db.database }}"]
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.umami.db.user }}", "-d", "{{ .Values.umami.db.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.umami.db.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.umami.db.storageSize }}
{{- end }}
