# TEMPLATE ONLY — never commit with real values.
# Apply via script using env vars or --from-file, not by editing this file.
#
# Usage:
#   kubectl create namespace arc-runners --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic riksdagskollen-arc-github-app \
#     --namespace arc-runners \
#     --from-literal=github_app_id="${APP_ID}" \
#     --from-literal=github_app_installation_id="${INSTALLATION_ID}" \
#     --from-file=github_app_private_key=./arc-app.pem \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# GitHub App setup:
#   1. Create at: https://github.com/settings/apps/new
#   2. Name: riksdagskollen-arc
#   3. Permissions: Actions (R/W), Checks (R/W), Contents (R), Metadata (R)
#   4. Generate private key → save as arc-app.pem (DO NOT commit)
#   5. Install app on swedish-democratic-tracker repo
#   6. Note App ID and Installation ID
apiVersion: v1
kind: Secret
metadata:
  name: riksdagskollen-arc-github-app
  namespace: arc-runners
type: Opaque
stringData:
  github_app_id: "<APP_ID>"
  github_app_installation_id: "<INSTALLATION_ID>"
  github_app_private_key: |
    <PRIVATE_KEY_PEM_CONTENTS>
