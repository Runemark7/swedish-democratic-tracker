githubConfigUrl: https://github.com/runemark7/swedish-democratic-tracker
githubConfigSecret: riksdagskollen-arc-github-app

# Scale to zero when idle
minRunners: 0
maxRunners: 4

# Docker-in-Docker mode required for docker build in CI
containerMode:
  type: dind

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
