server:
  service:
    type: NodePort
  extraArgs:
    - --insecure
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.runevibe.se
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

configs:
  params:
    server.insecure: true
    timeout.reconciliation: 60s

# Disable dex (SSO) for simplicity — use admin password
dex:
  enabled: false
