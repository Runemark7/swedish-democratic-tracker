services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: riksdagskollen
      POSTGRES_USER: riksdagskollen
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riksdagskollen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev           # Alpine stage — has wget for healthcheck
    environment:
      DATABASE_URL: postgres://riksdagskollen:localdev@postgres:5432/riksdagskollen?sslmode=disable
      PORT: "8080"
      MIGRATIONS_PATH: "file:///migrations"
      CORS_ALLOWED_ORIGIN: "http://localhost:5173"
      INITIAL_SYNC: "true"
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    # healthcheck is baked into the dev stage Dockerfile

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:8080"   # UI at http://localhost:5173
    depends_on:
      backend:
        condition: service_healthy   # don't proxy until backend is ready

  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    environment:
      BASE_URL: http://frontend:8080
      API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    profiles:
      - test
    restart: "no"

volumes:
  postgres_data:
