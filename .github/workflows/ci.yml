name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/runemark7/riksdagskollen-api
  FRONTEND_IMAGE: ghcr.io/runemark7/riksdagskollen-frontend

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    # Postgres 18 matches production. Local compose is still 17; this job
    # follows the production major version the issue asks CI to run against.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: riksdagskollen
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: riksdagskollen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riksdagskollen -d riksdagskollen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://riksdagskollen:localdev@127.0.0.1:5432/riksdagskollen?sslmode=disable
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        working-directory: backend
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          migrate -path migrations -database "$TEST_DATABASE_URL" up

      - name: Test
        working-directory: backend
        # -count=1 disables the Go test cache. setup-go restores GOCACHE, and
        # a cache hit would skip the database tests on a later run of the
        # same sources.
        run: go test -count=1 ./...

  build-backend:
    name: Build & push backend
    runs-on: ubuntu-latest
    needs: [test-backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Typecheck
        working-directory: backend
        run: go build ./...

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & push frontend
    runs-on: ubuntu-latest
    needs: [test-backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Sync data sources
        working-directory: frontend
        run: npm run sync:data-sources

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-image-tags:
    name: Update image tags in values-prod.yaml
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        run: |
          yq e '.backend.image.tag = "${{ github.sha }}"' -i deploy/charts/riksdagskollen/values-prod.yaml
          yq e '.frontend.image.tag = "${{ github.sha }}"' -i deploy/charts/riksdagskollen/values-prod.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/charts/riksdagskollen/values-prod.yaml
          git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push
