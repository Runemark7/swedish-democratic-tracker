name: verify-sources

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  pull_request:
    paths:
      - "docs/data-sources/**"
      - "frontend/scripts/verify-sources.mjs"
      - "frontend/scripts/sync-data-sources.mjs"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run verify-sources
        id: verify
        working-directory: frontend
        run: npm run verify:sources

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: frontend/verify-report.json

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The label must exist before `gh issue create --label` will accept it.
          # Previously it did not, so the alerting step itself failed and the
          # drift was never reported — the failure was silent exactly when it
          # mattered. Creating it here is idempotent and self-healing.
          gh label create data-source-drift \
            --repo "$REPO" \
            --color d93f0b \
            --description "Weekly verify-sources found an unreachable or changed upstream source" \
            --force

          BODY=$(printf '%s\n' \
            "Weekly \`verify-sources\` run failed." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Download the \`verify-report.json\` artifact from that run for per-source detail." \
            "" \
            "Upstream endpoints are occasionally flaky, so a single failure is not proof of real drift — re-run the workflow before editing any source doc.")

          gh issue create \
            --repo "$REPO" \
            --title "data-source drift detected $(date -u +%Y-%m-%d)" \
            --label data-source-drift \
            --body "$BODY"
